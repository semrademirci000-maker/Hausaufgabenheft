name: App bauen und Screenshots

# Baut die App auf einem Mac in der Cloud, startet sie im iPhone- und
# iPad-Simulator und legt Screenshots in den Ordner "screenshots".

on:
  push:
    branches:
      - "claude/**"
      - main
    paths-ignore:
      - "screenshots/**"
      - "**/*.md"
      - "web-legacy/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bauen, starten, fotografieren
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: App für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Schulplaner.xcodeproj \
            -scheme Schulplaner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: App starten und Screenshots machen
        run: bash .github/scripts/screenshots.sh

      - name: App als ZIP verpacken
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" Schulplaner-Simulator.zip

      - name: App zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Schulplaner-Simulator-App
          path: Schulplaner-Simulator.zip
          retention-days: 30

      - name: App in der Cloud zum Antippen bereitstellen (Appetize)
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_TOKEN" ]; then
            echo "Kein APPETIZE_TOKEN hinterlegt – Schritt wird übersprungen."
            echo "### App im Browser testen" >> $GITHUB_STEP_SUMMARY
            echo "Noch kein Appetize-Token hinterlegt. Anleitung steht im README unter 'Testen ohne Mac'." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            URL="https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY"
          else
            URL="https://api.appetize.io/v1/apps"
          fi

          ANTWORT=$(curl -sS -X POST "$URL" \
            -H "X-API-KEY: $APPETIZE_TOKEN" \
            -F "file=@Schulplaner-Simulator.zip" \
            -F "platform=ios")

          echo "$ANTWORT" | python3 -c "
import json, sys, os
try:
    data = json.loads(sys.stdin.read())
except Exception:
    print('Antwort von Appetize nicht lesbar.'); raise SystemExit(0)
link = data.get('publicURL', '')
key = data.get('publicKey', '')
summary = os.environ.get('GITHUB_STEP_SUMMARY')
text = '### App im Browser testen\n\n'
if link:
    text += 'Hier antippen: ' + link + '\n\nDauerhafter Schlüssel (als Secret APPETIZE_PUBLIC_KEY speichern): ' + key + '\n'
else:
    text += 'Appetize meldete: ' + json.dumps(data)[:400] + '\n'
print(text)
if summary:
    open(summary, 'a').write(text)
"

      - name: Screenshots zum Herunterladen bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots
          retention-days: 30
          if-no-files-found: ignore

      - name: Screenshots ins Repo legen
        if: always()
        run: |
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "Keine Screenshots vorhanden."
            exit 0
          fi
          git config user.name "Cloud-Build"
          git config user.email "actions@users.noreply.github.com"
          # immer auf dem aktuellen Stand des Zweigs aufsetzen,
          # sonst wird der Push abgelehnt, wenn zwischendurch etwas gepusht wurde
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B screenshot-update "origin/${GITHUB_REF_NAME}"
          git add screenshots
          if git diff --staged --quiet; then
            echo "Screenshots unverändert."
          else
            git commit -m "Screenshots aus dem Cloud-Build [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
