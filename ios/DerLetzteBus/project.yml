# Ersatzweg, falls die .xcodeproj-Datei nicht passt:
#   brew install xcodegen && xcodegen generate
name: DerLetzteBus
options:
  bundleIdPrefix: de.schulplaner
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  DerLetzteBus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - DerLetzteBus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.schulplaner.derletztebus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Letzter Bus"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
