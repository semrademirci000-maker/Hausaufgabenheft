# Ersatzweg, falls die .xcodeproj-Datei nicht passt:
#   brew install xcodegen && xcodegen generate
name: Emo
options:
  bundleIdPrefix: de.schulplaner
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Emo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Emo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.schulplaner.emo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Emo
        INFOPLIST_KEY_NSCameraUsageDescription: "Emo schaut dich mit der Kamera an und erkennt deine Handzeichen."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Emo hört dir zu, damit du mit ihm sprechen kannst."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Emo versteht, was du sagst (z. B. „Hände hoch!“)."
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
