# Ersatzweg, falls die .xcodeproj-Datei nicht passt:
#   brew install xcodegen && xcodegen generate
name: Oakblade
options:
  bundleIdPrefix: de.oakblade
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Oakblade:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Oakblade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.oakblade.game
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Oakblade
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
