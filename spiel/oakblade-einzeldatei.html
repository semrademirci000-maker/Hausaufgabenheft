<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0a10">
<title>Oakblade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: #07060c;
  color: #fff;
  font-family: "Courier New", ui-monospace, monospace;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#wrap {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative;
  width: 320px; height: 240px;
  transform-origin: center center;
}

#game {
  display: block;
  width: 320px; height: 240px;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Textbox im Undertale-Stil ---------- */
#box {
  position: absolute;
  left: 6px; right: 6px; bottom: 6px;
  min-height: 62px;
  background: #000;
  border: 3px solid #fff;
  padding: 5px 7px 6px;
  display: none;
  pointer-events: auto;
}
#box.on { display: block; }

#who {
  font-size: 8px; letter-spacing: 1px;
  color: #ffd24a; margin-bottom: 3px;
  text-transform: uppercase;
}
#txt {
  font-size: 10px; line-height: 13px;
  color: #fff; white-space: pre-wrap; word-break: break-word;
  min-height: 26px;
}
#opts { margin-top: 3px; }
.opt {
  position: relative;
  font-size: 10px; line-height: 13px;
  padding-left: 11px; color: #dcdcdc; cursor: pointer;
}
.opt.sel { color: #fff; }
.opt.sel::before {
  content: "♥"; position: absolute; left: 0; top: 0; color: #ff5a5a;
}
#more {
  position: absolute; right: 6px; bottom: 2px;
  font-size: 9px; color: #fff; display: none;
}
#more.on { display: block; animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- Knöpfe ---------- */
#sound {
  position: fixed; top: 8px; right: 8px;
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid #4a4560; background: #14121c; color: #ffd24a;
  font-size: 15px; line-height: 1; cursor: pointer; z-index: 5;
}
#sound.off { color: #5a5670; }

/* ---------- Steuerkreuz und Knöpfe: immer da ---------- */
#touch {
  display: block;
  position: fixed; inset: auto 0 0 0; height: 160px;
  z-index: 4; pointer-events: none;
}
/* Beim Reden und auf dem Titelbild stören die Knöpfe nur */
#touch.off { display: none; }
#abtn {
  position: absolute; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: flex-end; pointer-events: auto;
}
.act {
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(30,28,44,.82); border: 2px solid #4a4560;
  color: #cfc9e6; font-size: 17px; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.act.big { width: 74px; height: 74px; border-color: #b8453f; color: #ff9a8a; font-size: 22px; }
.act.auto { border-color: #e8a54a; color: #ffd24a; }
.act.karte { border-color: #4a7fb8; color: #9fd0f0; }
.act.rolle { border-color: #6ab87f; color: #9fe0b0; }
.act small { font-size: 7px; opacity: .75; margin-top: 2px; }
.act:active { background: #3b3660; }

/* Auf schmalen Bildschirmen ruecken die vier Knoepfe zusammen */
@media (max-width: 760px) {
  #abtn { right: 8px; gap: 5px; }
  .act { width: 46px; height: 46px; font-size: 13px; }
  .act.big { width: 58px; height: 58px; font-size: 17px; }
  .act small { font-size: 6px; }
}

/* Mit Maus und Tastatur halten sich die Knöpfe zurück */
@media (pointer: fine) {
  #abtn { opacity: .55; transition: opacity .2s; }
  #abtn:hover { opacity: 1; }
}

</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="240"></canvas>

    <div id="ui">
      <!-- Undertale-artige Textbox -->
      <div id="box">
        <div id="who"></div>
        <div id="txt"></div>
        <div id="opts"></div>
        <div id="more">▼</div>
      </div>
    </div>
  </div>
</div>

<button id="sound" title="Musik an/aus">♪</button>

<div id="touch">
  <div id="abtn">
    <button class="act auto" data-k="auto">&#128663;<small id="autotext">Stadt</small></button>
    <button class="act karte" data-k="karte">&#128506;<small>Karte</small></button>
    <button class="act" data-k="talk">E<small>reden</small></button>
    <button class="act rolle" data-k="rolle">&#128168;<small>Rolle</small></button>
    <button class="act big" data-k="attack">⚔<small>schlagen</small></button>
  </div>
</div>

<script>
/* joystick.js – Virtueller Joystick im Brawl-Stars-Stil.

   Finger irgendwo aufsetzen: der Stick erscheint genau dort und folgt dem
   Daumen. Loslassen blendet ihn wieder aus.

   Wichtig: Es wird sowohl auf Finger- (touch) als auch auf Maus-Ereignisse
   gehorcht. Nur auf "pointer"-Ereignisse zu bauen hat sich als unzuverlässig
   erwiesen – in manchen Umgebungen kommen sie nicht an.

   Ein kurzes Tippen ohne Ziehen ist kein Laufen, sondern ein Tipp: dafür
   gibt es `onTap` (das Spiel liest damit Texte weiter).
*/
(function (global) {
  'use strict';

  class Joystick {

    constructor(options) {
      var o = options || {};
      this.radius = o.radius || 60;
      this.deadZone = o.deadZone != null ? o.deadZone : 0.18;
      this.canStart = o.canStart || function () { return true; };
      this.ignore = o.ignore || function () { return false; };
      this.onTap = o.onTap || null;

      this.x = 0;              // -1 .. 1  (links/rechts)
      this.y = 0;              // -1 .. 1  (oben/unten, + = runter)
      this.active = false;     // Finger liegt auf und der Stick ist sichtbar
      this.used = false;       // schon einmal benutzt (für den Hinweis)

      this._touchId = null;    // welcher Finger zieht gerade
      this._lastTouch = 0;     // wann zuletzt ein Finger/Pointer kam
      this.visible = false;    // wird vom Spiel ein- und ausgeschaltet
      this._down = false;      // Finger liegt auf (auch wenn kein Stick)
      this._origin = { x: 0, y: 0 };
      this._moved = 0;
      this._start = 0;

      var zone = o.zone || document.body;

      this.base = document.createElement('div');
      this.base.style.cssText =
        'position:fixed;width:' + (this.radius * 2) + 'px;height:' + (this.radius * 2) + 'px;' +
        'border-radius:50%;background:rgba(30,28,44,.55);' +
        'border:3px solid rgba(207,201,230,.75);pointer-events:none;' +
        'display:none;z-index:9999;transform:translate(-50%,-50%);';

      this.knob = document.createElement('div');
      this.knob.style.cssText =
        'position:fixed;width:' + this.radius + 'px;height:' + this.radius + 'px;' +
        'border-radius:50%;background:rgba(150,142,205,.9);' +
        'border:3px solid rgba(255,255,255,.85);pointer-events:none;' +
        'display:none;z-index:10000;transform:translate(-50%,-50%);';

      document.body.appendChild(this.base);
      document.body.appendChild(this.knob);

      zone.style.touchAction = 'none';
      document.documentElement.style.touchAction = 'none';

      var self = this;
      global.addEventListener('resize', function () {
        if (!self._down) self._zeigeRuheplatz();
      });

      this._listen(zone);
    }

    /* ---- Ereignisse ----------------------------------------------------
       Es wird auf ALLE Arten gehorcht: pointer, touch und Maus. Welche ein
       Geraet schickt, ist von Browser zu Browser verschieden - und manche
       schicken die eine zum Anfassen und die andere zum Ziehen. Deshalb
       darf jede Art jede laufende Beruehrung fortsetzen; doppelte Meldungen
       schreiben einfach denselben Wert und stoeren nicht.
       Nur echte Maus-Echos nach einer Fingerberuehrung werden verworfen. */
    _listen(zone) {
      var self = this;

      function istEcho(art) {
        return art === 'maus' && (Date.now() - self._lastTouch) < 900;
      }
      function merken(art) {
        if (art !== 'maus') self._lastTouch = Date.now();
      }

      /* 1) Pointer */
      if (global.PointerEvent) {
        zone.addEventListener('pointerdown', function (e) {
          merken('pointer');
          self._begin(e, e, null);
        });
        global.addEventListener('pointermove', function (e) {
          merken('pointer');
          self._drag(e);
        });
        global.addEventListener('pointerup', function () { merken('pointer'); self._stop(); });
        global.addEventListener('pointercancel', function () { merken('pointer'); self._stop(); });
      }

      /* 2) Finger */
      zone.addEventListener('touchstart', function (e) {
        var t = e.changedTouches[0];
        if (!t) return;
        merken('touch');
        self._begin(t, e, t.identifier);
      }, { passive: false });

      global.addEventListener('touchmove', function (e) {
        merken('touch');
        var t = self._passenderFinger(e.changedTouches);
        if (!t) return;
        self._drag(t);
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      var fingerWeg = function (e) {
        merken('touch');
        if (self._touchId === null || self._passenderFinger(e.changedTouches)) self._stop();
      };
      global.addEventListener('touchend', fingerWeg);
      global.addEventListener('touchcancel', fingerWeg);

      /* 3) Maus */
      zone.addEventListener('mousedown', function (e) {
        if (istEcho('maus')) return;
        self._begin(e, e, null);
      });
      global.addEventListener('mousemove', function (e) {
        if (istEcho('maus')) return;
        self._drag(e);
      });
      global.addEventListener('mouseup', function () {
        if (istEcho('maus')) return;
        self._stop();
      });

      global.addEventListener('blur', function () { self.release(); });
    }

    /* Der Stick sitzt in Ruhe unten links - damit man ihn sieht. */
    _ruheplatz() {
      return { x: 30 + this.radius, y: global.innerHeight - 30 - this.radius };
    }

    _zeigeRuheplatz() {
      if (!this.visible) return;
      var platz = this._ruheplatz();
      this.base.style.left = this.knob.style.left = platz.x + 'px';
      this.base.style.top = this.knob.style.top = platz.y + 'px';
      this.base.style.display = this.knob.style.display = 'block';
      this.base.style.opacity = this.knob.style.opacity = '0.45';
    }

    /* Das Spiel sagt, wann gelaufen werden darf. */
    setVisible(sichtbar) {
      if (sichtbar === this.visible) return;
      this.visible = sichtbar;
      if (!sichtbar) {
        this.release();
        this.base.style.display = this.knob.style.display = 'none';
      } else {
        this._zeigeRuheplatz();
      }
    }

    /* Der Finger, der den Stick angefasst hat (falls bekannt). */
    _passenderFinger(liste) {
      if (this._touchId === null) return liste[0] || null;
      for (var i = 0; i < liste.length; i++) {
        if (liste[i].identifier === this._touchId) return liste[i];
      }
      return null;
    }

    _begin(point, event, touchId) {
      if (this._down) return;
      if (this.ignore(point.target)) return;        // Knöpfe haben Vorrang

      this._down = true;
      this._touchId = (touchId === undefined) ? null : touchId;
      this._origin = { x: point.clientX, y: point.clientY };
      this._lastX = point.clientX;
      this._lastY = point.clientY;
      this._moved = 0;
      this._start = Date.now();

      if (this.canStart()) {
        this.active = true;
        this.used = true;
        this.base.style.left = this.knob.style.left = point.clientX + 'px';
        this.base.style.top = this.knob.style.top = point.clientY + 'px';
        this.base.style.display = this.knob.style.display = 'block';
        this.base.style.opacity = this.knob.style.opacity = '1';
      }
      if (event && event.cancelable) event.preventDefault();
    }

    _drag(point) {
      if (!this._down) return;

      this._lastX = point.clientX;
      this._lastY = point.clientY;
      var dx = point.clientX - this._origin.x;
      var dy = point.clientY - this._origin.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > this._moved) this._moved = dist;
      if (!this.active) return;

      if (dist > this.radius) {
        dx = dx / dist * this.radius;
        dy = dy / dist * this.radius;
      }
      this.knob.style.left = (this._origin.x + dx) + 'px';
      this.knob.style.top = (this._origin.y + dy) + 'px';

      var nx = dx / this.radius, ny = dy / this.radius;
      if (Math.sqrt(nx * nx + ny * ny) < this.deadZone) { this.x = 0; this.y = 0; }
      else { this.x = nx; this.y = ny; }
    }

    _stop() {
      if (!this._down) return;
      var kurz = this._moved < 14 && (Date.now() - this._start) < 600;
      this.release();
      if (kurz && this.onTap) this.onTap(this._lastX, this._lastY);   // getippt statt gezogen
    }

    /* Alles loslassen – auch von aussen aufrufbar. */
    release() {
      this._down = false;
      this.active = false;
      this._touchId = null;
      this.x = this.y = 0;
      if (this.visible) this._zeigeRuheplatz();
      else this.base.style.display = this.knob.style.display = 'none';
    }

    get angle() { return Math.atan2(this.y, this.x); }
    get distance() { return Math.min(1, Math.sqrt(this.x * this.x + this.y * this.y)); }
  }

  global.Joystick = Joystick;
})(window);

</script>
<script>
/* effekte.js – alles, was knallt: Pixelfetzen, Schadenszahlen,
   Schlagringe und die kurze Trefferpause (hit stop).
   Nichts davon kennt das Spiel – es wird nur aufgerufen. */
(function (global) {
  'use strict';

  var teile = [];     /* fliegende Pixel */
  var texte = [];     /* Zahlen und Rufe, die nach oben steigen */
  var ringe = [];     /* Schockwellen */
  var stopT = 0;      /* so lange steht die Welt beim Treffer still */
  var blitzT = 0, blitzFarbe = '#fff';

  var MAX = 220;      /* mehr Pixel gleichzeitig braucht kein Mensch */

  function push(t) {
    if (teile.length >= MAX) teile.shift();
    teile.push(t);
  }

  /* ---------- Pixelfetzen ---------- */
  function funken(x, y, n, farbe, kraft) {
    kraft = kraft || 90;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = kraft * (0.35 + Math.random() * 0.9);
      push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
             g: 210, t: 0, leben: 0.32 + Math.random() * 0.4,
             f: farbe || '#fff', gr: Math.random() < 0.3 ? 2 : 1 });
    }
  }

  /* Fetzen in eine Richtung – fuer Treffer */
  function spritzer(x, y, n, farbe, dx, dy) {
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= len; dy /= len;
    for (var i = 0; i < n; i++) {
      var streu = (Math.random() - 0.5) * 1.5;
      var vx = dx * Math.cos(streu) - dy * Math.sin(streu);
      var vy = dx * Math.sin(streu) + dy * Math.cos(streu);
      var s = 60 + Math.random() * 130;
      push({ x: x, y: y, vx: vx * s, vy: vy * s - 40,
             g: 240, t: 0, leben: 0.3 + Math.random() * 0.35,
             f: farbe || '#8fd36a', gr: Math.random() < 0.35 ? 2 : 1 });
    }
  }

  /* Staubwoelkchen unter den Fuessen */
  function staub(x, y) {
    push({ x: x + (Math.random() - 0.5) * 6, y: y, vx: (Math.random() - 0.5) * 18,
           vy: -6 - Math.random() * 10, g: 20, t: 0, leben: 0.35,
           f: 'rgba(200,190,170,0.55)', gr: 1 });
  }

  /* Glutstaub in der Nacht, Bluetenblaetter am Tag */
  function schweben(x, y, farbe) {
    push({ x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: -4 - Math.random() * 8,
           g: -4, t: 0, leben: 1.6 + Math.random(), f: farbe, gr: 1, flimmer: true });
  }

  /* ---------- Zahlen und Rufe ---------- */
  function text(x, y, s, farbe, gross) {
    texte.push({ x: x, y: y, s: '' + s, f: farbe || '#fff',
                 t: 0, leben: gross ? 1.1 : 0.75, gross: !!gross,
                 vy: gross ? -22 : -30, vx: (Math.random() - 0.5) * 14 });
  }

  /* ---------- Schockwelle ---------- */
  function ring(x, y, r, farbe, dick) {
    ringe.push({ x: x, y: y, r0: 2, r1: r, t: 0, leben: 0.26,
                 f: farbe || 'rgba(255,255,255,0.9)', d: dick || 2 });
  }

  /* ---------- Trefferpause und Blitz ---------- */
  function stop(s) { if (s > stopT) stopT = s; }
  function blitz(s, farbe) { blitzT = Math.max(blitzT, s); blitzFarbe = farbe || '#fff'; }
  function wartet() { return stopT > 0; }

  function leeren() { teile.length = 0; texte.length = 0; ringe.length = 0; stopT = 0; blitzT = 0; }

  /* ---------- Rechnen ---------- */
  function update(dt) {
    if (stopT > 0) { stopT = Math.max(0, stopT - dt); }
    blitzT = Math.max(0, blitzT - dt);
    var i, p;
    for (i = teile.length - 1; i >= 0; i--) {
      p = teile[i];
      p.t += dt;
      if (p.t >= p.leben) { teile.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.vx *= 0.97;
    }
    for (i = texte.length - 1; i >= 0; i--) {
      p = texte[i];
      p.t += dt;
      if (p.t >= p.leben) { texte.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy *= 0.92;
    }
    for (i = ringe.length - 1; i >= 0; i--) {
      p = ringe[i];
      p.t += dt;
      if (p.t >= p.leben) ringe.splice(i, 1);
    }
  }

  /* ---------- Zeichnen (in Weltkoordinaten) ---------- */
  function draw(ctx, camX, camY) {
    var i, p, k;
    for (i = 0; i < ringe.length; i++) {
      p = ringe[i];
      k = p.t / p.leben;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = p.f;
      ctx.lineWidth = p.d;
      ctx.beginPath();
      ctx.arc(Math.round(p.x - camX), Math.round(p.y - camY),
              p.r0 + (p.r1 - p.r0) * k, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < teile.length; i++) {
      p = teile[i];
      k = p.t / p.leben;
      ctx.globalAlpha = p.flimmer ? (0.35 + 0.5 * Math.abs(Math.sin(p.t * 9))) * (1 - k)
                                  : Math.min(1, 2.2 - k * 2.2);
      ctx.fillStyle = p.f;
      ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), p.gr, p.gr);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    for (i = 0; i < texte.length; i++) {
      p = texte[i];
      k = p.t / p.leben;
      ctx.globalAlpha = Math.min(1, 2.4 - k * 2.4);
      ctx.font = (p.gross ? 'bold 11px' : 'bold 9px') + ' "Courier New", monospace';
      var tx = Math.round(p.x - camX), ty = Math.round(p.y - camY);
      ctx.fillStyle = '#000';
      ctx.fillText(p.s, tx + 1, ty + 1);
      ctx.fillStyle = p.f;
      ctx.fillText(p.s, tx, ty);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  /* Weisser Blitz ueber dem ganzen Bild */
  function drawBlitz(ctx, VW, VH) {
    if (blitzT <= 0) return;
    ctx.globalAlpha = Math.min(0.6, blitzT * 3);
    ctx.fillStyle = blitzFarbe;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }

  global.Fx = {
    funken: funken, spritzer: spritzer, staub: staub, schweben: schweben,
    text: text, ring: ring, stop: stop, blitz: blitz, wartet: wartet,
    update: update, draw: draw, drawBlitz: drawBlitz, leeren: leeren,
    anzahl: function () { return teile.length; }
  };
})(window);

</script>
<script>
/* gegner.js – die Zombiesorten und die Wellen.
   Hier stehen nur die Daten; wie sie sich bewegen, steht in game.js. */
(function (global) {
  'use strict';

  /* Jede Sorte hat eine eigene Farbpalette, damit man sie sofort erkennt. */
  var ARTEN = {
    normal: {
      name: 'Zombie', hp: 3, tempo: 26, jagd: 150, schaden: 1, gr: 1,
      muenzen: [1, 3], wucht: 1,
      pal: { hair: '#2f4a2a', skin: '#7aa85f', eye: '#c43a2a',
             shirt: '#5b4a3a', shirtDark: '#443528', pants: '#3a3a44', boots: '#2a2622' },
      fetzen: '#8fd36a'
    },
    renner: {
      name: 'Renner', hp: 2, tempo: 58, jagd: 190, schaden: 1, gr: 0.92,
      muenzen: [2, 4], wucht: 1.3, sprint: true,
      pal: { hair: '#6a7a2a', skin: '#b8d06a', eye: '#ffde3a',
             shirt: '#8a6a2a', shirtDark: '#6a4f1e', pants: '#4a4428', boots: '#2e2a1a' },
      fetzen: '#d8e87a'
    },
    panzer: {
      name: 'Panzer', hp: 8, tempo: 15, jagd: 170, schaden: 2, gr: 1.3,
      muenzen: [5, 9], wucht: 0.18,

  function wuerfelArt(stufe, nachts, welle) {
    var topf = ['normal', 'normal', 'normal'];
    if (stufe >= 4) topf.push('renner');
    if (stufe >= 8) topf.push('renner', 'kriecher');
    if (stufe >= 14) topf.push('panzer', 'spucker');
    if (stufe >= 22) topf.push('panzer', 'spucker', 'renner');
    if (nachts) {
      topf.push('schatten');
      if (stufe >= 10) topf.push('schatten', 'renner');
    }
    if (welle) topf.push('renner', 'kriecher', 'panzer');
    return topf[(Math.random() * topf.length) | 0];
  }

  /* Der Ritter in besserer Ruestung und mit besserem Schwert */
  var RUESTUNGEN = [
    { a: '#d3dbe8', b: '#9aa4b8', c: '#646e82' },   /* Eisen */
    { a: '#e8c48a', b: '#b3853f', c: '#7a5a28' },   /* Bronze */
    { a: '#eaf1fb', b: '#b6c2d6', c: '#7d8a9e' },   /* Silber */
    { a: '#ffe08a', b: '#d8a43a', c: '#96702a' }    /* Gold */
  ];
  var KLINGEN = [
    { w: '#eef3fb', g: '#aab6c8' },
    { w: '#ffffff', g: '#c4cedd' },
    { w: '#dff0ff', g: '#9ec6e8' },
    { w: '#ffe8a0', g: '#d8a43a' }
  ];

  var knightCache = {}, swordCache = {};

  function knightFor(stufe) {
    stufe = Math.max(0, Math.min(RUESTUNGEN.length - 1, stufe || 0));
    if (knightCache[stufe]) return knightCache[stufe];
    var r = RUESTUNGEN[stufe];
    var pal = {
      o: KP.o, a: r.a, b: r.b, c: r.c, t: KP.t, u: KP.u,
      s: KP.s, r: KP.r, k: KP.k, n: KP.n
    };
    var side = [sprite(knightSide, pal), sprite(knightSide2, pal)];
    knightCache[stufe] = {
      down: [sprite(knightDown, pal), sprite(knightDown2, pal)],
      up: [sprite(knightUp, pal), sprite(knightUp2, pal)],
      right: side,
      left: [flipX(side[0]), flipX(side[1])]
    };
    return knightCache[stufe];
  }

  function swordFor(stufe) {
    stufe = Math.max(0, Math.min(KLINGEN.length - 1, stufe || 0));
    if (swordCache[stufe]) return swordCache[stufe];
    var k = KLINGEN[stufe];
    swordCache[stufe] = sprite([
      '..w..', '..w..', '.www.', '.wgw.', '.wgw.', '.wgw.', '.wgw.',
      '.wgw.', '.wgw.', 'hhhhh', '..n..', '..n..', '..n..', '..h..'
    ], { w: k.w, g: k.g, h: '#d8a43a', n: '#6b4a2b' });
    return swordCache[stufe];
  }


  /* ---- Sammelzeug und der Hund ----------------------------------- */

  /* Wuffel, der Familienhund */
  function makeDog(schwanzHoch) {
    var c = mk(16, 14), g = c.getContext('2d');

    g.fillStyle = '#1b1524'; g.fillRect(2, 5, 12, 8);

  /* =========================================================
     KACHELN (16x16) – Wald, Haus, Stadt
     ========================================================= */
  var T = 16;
  function tileCanvas() { return mk(T, T); }

  function grassTile(seed, tuft, flower) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#4b8f46'; g.fillRect(0, 0, T, T);
    var i;
    for (i = 0; i < 26; i++) g.fillStyle = '#437f3f', g.fillRect((r() * T) | 0, (r() * T) | 0, 1, 1);
    for (i = 0; i < 10; i++) g.fillStyle = '#57a24f', g.fillRect((r() * T) | 0, (r() * T) | 0, 1, 2);
    if (tuft) {
      for (i = 0; i < 5; i++) {
        var x = 3 + ((r() * 10) | 0), y = 4 + ((r() * 9) | 0);
        g.fillStyle = '#2f6b34'; g.fillRect(x, y, 1, 3);
        g.fillStyle = '#63b158'; g.fillRect(x + 1, y + 1, 1, 2);
      }
    }
    if (flower) {
      var fc = ['#f0d24a', '#e8718a', '#e8e2f0'];
      for (i = 0; i < 4; i++) {
        var fx = 2 + ((r() * 12) | 0), fy = 2 + ((r() * 12) | 0);
        g.fillStyle = fc[(r() * 3) | 0];
        g.fillRect(fx, fy, 2, 2);
        g.fillStyle = '#2f6b34'; g.fillRect(fx, fy + 2, 1, 2);
      }
    }
    return c;
  }
  function pathTile(seed) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#b08a58'; g.fillRect(0, 0, T, T);
    for (var i = 0; i < 30; i++) {
      g.fillStyle = r() > 0.5 ? '#9c7647' : '#c6a06a';
      g.fillRect((r() * T) | 0, (r() * T) | 0, 1 + ((r() * 2) | 0), 1);
    }
    for (i = 0; i < 3; i++) {
      g.fillStyle = '#8a6840';
      g.fillRect((r() * 13) | 0, (r() * 13) | 0, 2, 2);
    }
    return c;
  }
  function waterTile(seed) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#2f5f9c'; g.fillRect(0, 0, T, T);
    g.fillStyle = '#3d78bd'; g.fillRect(0, 0, T, 8);
    for (var i = 0; i < 5; i++) {
      g.fillStyle = '#7fb6e2';
      g.fillRect((r() * 11) | 0, (r() * 15) | 0, 4, 1);
    }
    return c;
  }
  function plankTile(base, dark, light, vertical) {
    var c = tileCanvas(), g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, T, T);
    for (var i = 0; i < T; i += 4) {
      g.fillStyle = dark;
      if (vertical) g.fillRect(i, 0, 1, T); else g.fillRect(0, i, T, 1);
      g.fillStyle = light;
      if (vertical) g.fillRect(i + 1, 0, 1, T); else g.fillRect(0, i + 1, T, 1);
    }
    g.fillStyle = dark;
    if (vertical) g.fillRect(0, 7, T, 1); else g.fillRect(7, 0, 1, T);
    return c;
  }
  function roofTile() {
    var c = tileCanvas(), g = c.getContext('2d');
    g.fillStyle = '#7a3327'; g.fillRect(0, 0, T, T);
    for (var y = 0; y < T; y += 5) {
      for (var x = (y % 10 === 0 ? 0 : -4); x < T; x += 8) {
        g.fillStyle = '#93413020'; // wird unten überschrieben
        g.fillStyle = '#944333';
        g.fillRect(x + 1, y, 6, 4);
        g.fillStyle = '#5e2419';
        g.fillRect(x, y + 4, 8, 1);

    return c;
  }
  function windowTile() {

  /* ---------- Neue Deko: Grabsteine, Lagerfeuer, Fass, Zaun ---------- */

(function (global) {

  function rng(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* Feste Buchstaben, die man nicht betreten kann */
  var SOLID = 'Tt*rs~#^W=bnmhFBCVKOQlP';

  function grid(w, h, ch) {
    var g = [];
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) row.push(ch);
      g.push(row);

  }
  function stamp(g, x0, y0, rows) {
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        var ch = rows[y][x];
        if (ch === '|') continue;            /* '|' = nichts verändern */
        if (g[y0 + y] && g[y0 + y][x0 + x] !== undefined) g[y0 + y][x0 + x] = ch;
      }
    }
  }
  function rect(g, x0, y0, w, h, ch) {
    for (var y = y0; y < y0 + h; y++) {
      for (var x = x0; x < x0 + w; x++) {
        if (g[y] && g[y][x] !== undefined) g[y][x] = ch;
      }
    }
  }
  function toStrings(g) {
    var out = [];
    for (var y = 0; y < g.length; y++) out.push(g[y].join(''));

  /* ============================ WALD ============================ */
  function buildWald() {
    var W = 44, H = 34, r = rng(20250914);
    var g = grid(W, H, '.');
    var x, y;

    /* Grasvarianten */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var v = r();
        g[y][x] = v > 0.9 ? 'f' : (v > 0.68 ? ',' : '.');
      }
    }
    /* Waldrand ringsum */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var d = Math.min(x, y, W - 1 - x, H - 1 - y);
        if (d === 0 || (d <= 2 && r() > 0.25)) g[y][x] = 'T';
      }
    }
    /* Baumgruppen im Inneren */
    for (var i = 0; i < 34; i++) {
      var cx = 4 + ((r() * (W - 8)) | 0), cy = 4 + ((r() * (H - 8)) | 0);
      var n = 1 + ((r() * 4) | 0);
      for (var k = 0; k < n; k++) {
        var tx = cx + ((r() * 4) | 0) - 2, ty = cy + ((r() * 4) | 0) - 2;
        if (g[ty] && g[ty][tx]) g[ty][tx] = r() > 0.65 ? 't' : 'T';
      }
    }
    /* Büsche, Steine */
    for (i = 0; i < 24; i++) {
      x = 3 + ((r() * (W - 6)) | 0); y = 3 + ((r() * (H - 6)) | 0);
      g[y][x] = r() > 0.45 ? '*' : 'r';
    }
    /* Teich unten rechts */
    for (y = 24; y < 31; y++) {
      for (x = 31; x < 41; x++) {
        var dx = (x - 36) / 5, dy = (y - 27.5) / 3.4;
        if (dx * dx + dy * dy < 1) g[y][x] = '~';
      }
    }

    /* Lichtung ums Haus frei räumen */
    rect(g, 3, 2, 18, 12, '.');
    for (y = 2; y < 14; y++) for (x = 3; x < 21; x++) if (r() > 0.75) g[y][x] = ',';

    /* Holzhaus (8 breit) bei x=6, y=3 */
    stamp(g, 6, 3, [
      '..^^^^^^^^..',
      '.^^^^^^^^^^.',
      '.^^^^^^^^^^.',
      '..#W####W#..',
      '..###Dd###..',
      '..--------..'
    ]);

    /* Weg vom Haus nach unten und nach rechts zum Auto */
    for (y = 9; y <= 17; y++) { g[y][11] = '-'; g[y][12] = '-'; }
    for (x = 11; x <= 27; x++) { g[17][x] = '-'; g[18][x] = '-'; }
    for (y = 17; y <= 22; y++) { g[y][26] = '-'; g[y][27] = '-'; }
    /* Platz fürs Auto frei halten */
    rect(g, 24, 14, 6, 4, '-');

    /* Lichtung in der Mitte (Kampfplatz) */
    rect(g, 14, 21, 12, 8, ',');
    for (y = 21; y < 29; y++) for (x = 14; x < 26; x++) if (r() > 0.82) g[y][x] = 'f';
    /* ein paar einzelne Bäume als Deko in der Lichtung */
    g[23][16] = 'T'; g[27][23] = 't'; g[25][20] = '*';

    /* --- Der alte Friedhof unten links: da kommen die Zombies her --- */
    rect(g, 4, 24, 8, 7, ',');
    for (y = 24; y < 31; y++) for (x = 4; x < 12; x++) if (r() > 0.7) g[y][x] = '.';
    /* Trampelpfad vom Weg zum Friedhof */
    for (x = 8; x <= 14; x++) { g[23][x] = '-'; }
    for (y = 19; y <= 23; y++) { g[y][14] = '-'; }

  /* ============================ HAUS ============================ */
  function buildHaus() {

  }

  /* ============================ STADT ============================ */
  function buildStadt() {
    var W = 44, H = 30, r = rng(31415);
    var g = grid(W, H, 'S');
    var x, y, i;

    /* Alles Gehweg, dann Straßen einzeichnen */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        /* Waagerechte Hauptstraße */
        if (y >= 13 && y <= 17) g[y][x] = (y === 15 ? 'M' : 'R');
        /* Senkrechte Straße */
        if (x >= 20 && x <= 24) g[y][x] = (x === 22 && !(y >= 13 && y <= 17) ? 'M' : 'R');
      }
    }
    /* Häuserblöcke */
    function block(x0, y0, w, h, kinds) {
      for (var yy = y0; yy < y0 + h; yy++) {
        for (var xx = x0; xx < x0 + w; xx++) {
          if (!g[yy] || g[yy][xx] === undefined) continue;
          var bi = Math.floor((xx - x0) / 4) + Math.floor((yy - y0) / 3) * 2;
          g[yy][xx] = kinds[bi % kinds.length];

      g[0][x] = 'B'; g[1][x] = 'B'; g[H - 1][x] = 'B'; g[H - 2][x] = 'B';
    }

    for (x = 0; x < W; x++) {
      if (x < 2 || x > W - 3) { g[14][x] = 'R'; g[15][x] = 'M'; g[16][x] = 'R'; }
    }

    /* Von oben sieht man Daecher - nur die Seite zur Strasse ist Hauswand */
    function offen(ch) { return 'SRM.,f-'.indexOf(ch) >= 0; }
    var g2 = [];
    for (y = 0; y < H; y++) g2.push(g[y].slice());
    for (y = 0; y < H; y++) {

        var ch = g[y][x];
        if ('BCVK'.indexOf(ch) < 0) continue;
        var untenFrei = (y + 1 < H) && offen(g[y + 1][x]);
        if (!untenFrei) g2[y][x] = (ch === 'C' || ch === 'K') ? 'Q' : 'O';

<script>
/* dialog.js – Textbox im Undertale-Stil: Buchstaben tippen sich einzeln,
   und man kann Antworten auswählen. */
(function (global) {
  'use strict';

  var box, whoEl, txtEl, optsEl, moreEl;

  var D = {
    queue: [],
    node: null,
    full: '',
    shown: 0,
    t: 0,
    speed: 42,          /* Buchstaben pro Sekunde */
    sel: 0,
    open: false,
    onFinish: null
  };

  function el(id) { return document.getElementById(id); }

  D.init = function () {
    box = el('box'); whoEl = el('who'); txtEl = el('txt');
    optsEl = el('opts'); moreEl = el('more');
    box.addEventListener('click', function (e) {
      if (e.target && e.target.classList.contains('opt')) return;
      D.press();
    });
  };

  /* text: String. who: Name. color: Farbe des Namens. opts: [{t:'Antwort', r:'Reaktion'}] */
  D.push = function (who, color, text, opts) {
    D.queue.push({ who: who, color: color || '#ffd24a', text: text, opts: opts || null });
  };
  D.say = function (who, color, text) { D.push(who, color, text); D.begin(); };

  D.begin = function (onFinish) {
    if (onFinish) D.onFinish = onFinish;
    if (!D.node) next();
  };

  function next() {
    if (!D.queue.length) {
      D.open = false;
      box.classList.remove('on');
      D.node = null;
      var f = D.onFinish; D.onFinish = null;
      if (f) f();
      return;
    }
    D.node = D.queue.shift();
    D.full = D.node.text;
    D.shown = 0; D.t = 0; D.sel = 0;
    D.open = true;
    box.classList.add('on');
    whoEl.textContent = D.node.who || '';
    whoEl.style.color = D.node.color || '#ffd24a';
    txtEl.textContent = '';
    optsEl.innerHTML = '';
    moreEl.classList.remove('on');
  }

  function showOptions() {
    optsEl.innerHTML = '';
    if (!D.node.opts) { moreEl.classList.add('on'); return; }
    for (var i = 0; i < D.node.opts.length; i++) {
      (function (i) {
        var d = document.createElement('div');
        d.className = 'opt' + (i === D.sel ? ' sel' : '');
        d.textContent = D.node.opts[i].t;
        d.addEventListener('click', function (ev) {
          ev.stopPropagation();
          D.sel = i; choose();
        });
        optsEl.appendChild(d);
      })(i);
    }
  }

  function markSel() {
    var kids = optsEl.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].className = 'opt' + (i === D.sel ? ' sel' : '');
    }
  }

  function choose() {
    var o = D.node.opts[D.sel];
    if (global.Audio8) Audio8.select();
    var node = D.node;
    D.node = null;
    optsEl.innerHTML = '';
    if (o.r) {
      D.queue.unshift({ who: node.who, color: node.color, text: o.r, opts: null });
    }
    if (o.go) o.go();
    next();
  }

  D.update = function (dt) {
    if (!D.node) return;
    if (D.shown < D.full.length) {
      D.t += dt * D.speed;
      while (D.t >= 1 && D.shown < D.full.length) {
        D.t -= 1; D.shown++;
        var c = D.full[D.shown - 1];
        if (c !== ' ' && global.Audio8 && D.shown % 2 === 0) Audio8.blip();
      }
      txtEl.textContent = D.full.slice(0, D.shown);
      if (D.shown >= D.full.length) showOptions();
    }
  };

  /* Bestätigen / weiter */
  D.press = function () {
    if (!D.node) return;
    if (D.shown < D.full.length) {          /* erst Text komplett zeigen */
      D.shown = D.full.length;
      txtEl.textContent = D.full;
      showOptions();
      return;
    }
    if (D.node.opts) { choose(); return; }
    D.node = null;
    next();
  };

  D.move = function (dir) {
    if (!D.node || !D.node.opts || D.shown < D.full.length) return;
    D.sel = (D.sel + dir + D.node.opts.length) % D.node.opts.length;
    if (global.Audio8) Audio8.blip();
    markSel();
  };

  D.isOpen = function () { return D.open; };
  D.clear = function () { D.queue.length = 0; D.node = null; D.open = false; if (box) box.classList.remove('on'); };

  global.Dialog = D;
})(window);

</script>

      intro: 'Der Baum vor dir macht die Augen auf. Und dann macht er einen Schritt.',
      spruch: 'Ihr... trampelt... auf... meinen... Wurzeln.',
      sieg: 'Alter Knorr setzt sich wieder hin und ist einfach nur noch ein Baum.'
    }
  ];

  var BOSS_LINES = {
    auftritt: [
      'Das ist kein normaler Zombie. Bleib dicht bei mir!',
      'Oh nein. OH NEIN. Ist der gross.',
      'Ausweichen, dann zuschlagen. Immer abwechselnd!',
      'Sowas hab ich zuletzt als Kind gesehen. Damals bin ich weggelaufen.'
    ],
    sieg: [
      'DAS war ein Kampf! Hast du gesehen, wie der umgefallen ist?',
      'Mein Herz klopft bis in die Ohren. Aber wir leben!',
      'Dein Schwert hat heute gesungen, Ritter.',
      'Ich erzaehl das heute Abend allen. Mit Handbewegungen.'
    ]
  };

  var Chat = {
    zombieTexte: ZOMBIE_TEXTE,
    zombieFreund: ZOMBIE_FREUND,
    spareLines: SPARE_LINES,
    shopLines: SHOP_LINES,
    bosse: BOSSE,
    bossLines: BOSS_LINES,
    people: PEOPLE,
    zombiePal: ZOMBIE_PAL,
    killLines: KILL_LINES,
    familyLines: FAMILY_LINES,
    cityLines: CITY_LINES,
    timer: 16 + Math.random() * 10,
    lastIdx: -1
  };

  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  /* Wird jede Sekunde vom Spiel gefragt: Zeit für eine Frage? */
  Chat.update = function (dt, game) {
    if (!game.party.length) return;
    if (global.Dialog.isOpen()) return;
    if (game.state !== 'play') return;
    if (game.zombieNear && game.zombieNear(120)) { Chat.timer = 5; return; }
    Chat.timer -= dt;
    if (Chat.timer > 0) return;
    Chat.timer = 20 + Math.random() * 18;
    Chat.ask(game, null);
  };

  /* Stellt eine Frage. who = Person (optional), ctx = Situation */
  Chat.ask = function (game, who, ctxName) {
    var partner = who || pick(game.party);
    var p = PEOPLE[partner.key] || PEOPLE.lisbeth;
    var ctx = ctxName || game.mapKey;
    var pool = FRAGEN[ctx] || FRAGEN.wald;
    var f = pool[(Math.random() * pool.length) | 0];
    var opts = f.a.map(function (o) {
      return { t: o.t, r: o.r };
    });
    global.Dialog.push(p.name + ' (' + p.rolle + ')', p.color, f.q, opts);
    global.Dialog.begin();
    partner.mood = (partner.mood || 0) + 1;
  };

  Chat.killLine = function (game) {
    if (!game.party.length || global.Dialog.isOpen()) return;
    if (game.zombieNear && game.zombieNear(95)) return;
    if (Math.random() > 0.5) return;
    var partner = pick(game.party);
    var p = PEOPLE[partner.key];
    global.Dialog.push(p.name, p.color, pick(KILL_LINES));
    global.Dialog.begin();
  };

  global.Chat = Chat;
})(window);

</script>
<script>
/* kampf.js – Der Bosskampf im Kampf-Fenster, ganz wie in Undertale.
   Du hast einen Zug (KÄMPFEN / HANDELN / ITEM / SCHONEN), danach greift
   der Boss an und du weichst mit deinem roten Herz den Geschossen aus. */
(function (global) {
  'use strict';

  var W = null;            // Verbindung zum Spiel (wird bei init gesetzt)
  var k = null;            // der laufende Kampf

  /* Das Kampf-Fenster */
  var BOX = { x: 18, y: 78, w: 284, h: 92 };
  var KNOEPFE = ['KAEMPFEN', 'HANDELN', 'ITEM', 'SCHONEN'];

  /* Was man bei welchem Boss alles machen kann */
  var HANDLUNGEN = {
    koenig: [
      { t: 'Krone zurechtruecken', r: 'Du richtest die schiefe Krone. Grauzahn brummt geschmeichelt.' },
      { t: 'Ueber Wuermer reden', r: 'Ihr fachsimpelt ueber Regenwuermer. Er nickt begeistert.' },
      { t: 'Mitstoehnen', r: 'Du machst "Grrraaah". Er macht "Grrraaah". Fast schon ein Duett.' }
    ],
    spinne: [
      { t: 'Das Netz loben', r: 'Du lobst die Netzkunst. Die Nachtweberin wird ganz verlegen.' },
      { t: 'Eine Fliege anbieten', r: 'Du fischst eine Fliege aus der Luft. Sie nimmt sie vorsichtig.' },
      { t: 'Langsam blinzeln', r: 'Ihr blinzelt euch an. Alle acht Augen blinzeln zurueck.' }
    ],
    wolf: [
      { t: 'Hinter den Ohren kraulen', r: 'Mondfell brummt. Das Bein zuckt. Es ist um ihn geschehen.' },
      { t: 'Stoeckchen werfen', r: 'Er rast los. Er kommt mit dem Stock zurueck. Er schaemt sich.' },
      { t: 'Zurueckheulen', r: 'Du heulst. Er heult. Der halbe Wald heult mit.' }
    ],
    knorr: [
      { t: 'Giessen', r: 'Du kippst deine Feldflasche an die Wurzeln. Knorr seufzt wohlig.' },
      { t: 'Blaetter putzen', r: 'Du wischst Staub von den Blaettern. Er glaenzt richtig.' },
      { t: 'Ein Lied summen', r: 'Du summst. Seine Aeste wiegen ganz langsam mit.' }
    ]
  };

  /* --------- Start und Ende --------- */

  function start(bossDaten) {
    k = {
      boss: bossDaten,
      hp: bossDaten.hp * 4,
      maxhp: bossDaten.hp * 4,
      phase: 'text',
      text: bossDaten.spruch,
      auswahl: 0,
      untermenue: null,
      mercy: 0,
      mercyZiel: 3,
      soul: { x: BOX.x + BOX.w / 2, y: BOX.y + BOX.h / 2 },
      invuln: 0,
      schuesse: [],
      t: 0,
      runde: 0,
      barX: 0, barRichtung: 1,
      ende: null,
      anim: 0
    };
    if (W.A) W.A.music('boss');
  }

  function beenden(wie) {
    var boss = k.boss;
    k = null;
    if (wie === 'sieg') W.onSieg(boss);
    else if (wie === 'verschont') W.onVerschont(boss);
  }

  /* --------- Der eigene Zug --------- */

  function menueWaehlen(nr) {
    if (k.phase !== 'menue') return;
    k.auswahl = nr;
    if (nr === 0) {                       /* KAEMPFEN */
      k.phase = 'balken';
      k.barX = 0; k.barRichtung = 1;
      if (W.A) W.A.blip();
    } else if (nr === 1) {                /* HANDELN */
      k.untermenue = (HANDLUNGEN[k.boss.key] || HANDLUNGEN.koenig).map(function (h) { return h; });
      k.phase = 'untermenue';
      if (W.A) W.A.blip();
    } else if (nr === 2) {                /* ITEM */
      itemBenutzen();
    } else {                              /* SCHONEN */
      schonen();
    }
  }

  function balkenStoppen() {
    var mitte = BOX.w / 2;
    var abstand = Math.abs(k.barX - mitte);
    var guete = Math.max(0.15, 1 - abstand / mitte);        /* je mittiger, desto besser */
    var schaden = Math.round((3 + W.G.swordLevel * 2) * (1 + guete * 2));
    k.hp -= schaden;
    if (W.A) W.A.hit();
    W.G.shake = 4;
    k.phase = 'text';
    k.t = 0;
    k.text = guete > 0.85 ? 'VOLLTREFFER! ' + schaden + ' Schaden!'
           : guete > 0.5 ? 'Guter Treffer! ' + schaden + ' Schaden.'
           : 'Nur gestreift. ' + schaden + ' Schaden.';
    if (k.hp <= 0) { k.ende = 'sieg'; k.text = k.boss.sieg; }
  }

  function handlungWaehlen(nr) {
    var h = k.untermenue[nr];
    if (!h) return;
    k.untermenue = null;
    k.mercy = Math.min(k.mercyZiel, k.mercy + 1);
    k.phase = 'text';
    k.t = 0;
    k.text = h.r + (k.mercy >= k.mercyZiel
      ? '  -  Jetzt kannst du ihn SCHONEN!'
      : '  (' + k.mercy + '/' + k.mercyZiel + ')');
    if (W.A) W.A.select();
  }

  function itemBenutzen() {
    var G = W.G;
    k.phase = 'text';
    k.t = 0;
    if (G.pilze > 0) {
      G.pilze--;
      G.player.hp = Math.min(G.player.maxhp, G.player.hp + 4);
      k.text = 'Du isst einen Pilz. Zwei Herzen zurueck!';
      if (W.A) W.A.heal();
    } else if (G.beeren > 0) {
      G.beeren--;
      G.player.hp = Math.min(G.player.maxhp, G.player.hp + 2);
      k.text = 'Du isst ein paar Beeren. Ein Herz zurueck!';
      if (W.A) W.A.heal();
    } else {
      k.text = 'Deine Taschen sind leer. Nur Fusseln und ein Stein.';
    }
  }

  function schonen() {
    k.phase = 'text';
    k.t = 0;
    if (k.mercy >= k.mercyZiel) {
      k.ende = 'verschont';
      k.text = k.boss.name + ' laesst die Schultern sinken und laechelt schief. Ihr seid fertig hier.';
      if (W.A) W.A.heal();
    } else {
      k.text = 'Noch will er nicht. Sei erst mal nett zu ihm (HANDELN).';
    }
  }

  /* --------- Der Zug des Bosses --------- */

  function angriffStarten() {
    k.phase = 'gegner';
    k.t = 0;
    k.schuesse = [];
    k.soul.x = BOX.x + BOX.w / 2;
    k.soul.y = BOX.y + BOX.h / 2;
    k.runde++;
    k.text = '';
  }

  function schussSetzen(x, y, vx, vy, r, farbe, art) {
    k.schuesse.push({ x: x, y: y, vx: vx, vy: vy, r: r, farbe: farbe, art: art || 'kugel', t: 0 });
  }

  function angriffMuster(dt) {
    var art = k.boss.key;
    k.spawnT = (k.spawnT || 0) - dt;
    if (k.spawnT > 0) return;

    if (art === 'koenig') {                 /* Wuermer regnen herunter */
      k.spawnT = 0.35;
      var x = BOX.x + 10 + Math.random() * (BOX.w - 20);
      schussSetzen(x, BOX.y - 6, 0, 46 + Math.random() * 34, 3, '#8a5a3a', 'wurm');
    } else if (art === 'spinne') {          /* Netzfaeden von den Seiten */
      k.spawnT = 0.45;
      var vonLinks = Math.random() > 0.5;
      var y = BOX.y + 12 + Math.random() * (BOX.h - 24);
      schussSetzen(vonLinks ? BOX.x - 6 : BOX.x + BOX.w + 6, y,
                   (vonLinks ? 1 : -1) * (55 + Math.random() * 35), 0, 3, '#c8c2e0', 'faden');
    } else if (art === 'wolf') {            /* Krallen zielen auf dich */
      k.spawnT = 0.7;
      var sx = Math.random() > 0.5 ? BOX.x - 6 : BOX.x + BOX.w + 6;
      var sy = BOX.y + Math.random() * BOX.h;
      var dx = k.soul.x - sx, dy = k.soul.y - sy;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      schussSetzen(sx, sy, dx / len * 85, dy / len * 85, 4, '#d24b4b', 'kralle');
    } else {                                /* Wurzeln schiessen hoch */
      k.spawnT = 0.8;
      var wx = BOX.x + 12 + Math.random() * (BOX.w - 24);
      schussSetzen(wx, BOX.y + BOX.h + 8, 0, -60, 4, '#5f4026', 'wurzel');
    }
  }

  function seeleBewegen(dt) {
    var dx = 0, dy = 0;
    var stick = W.stick();
    if (stick && stick.active && (stick.x || stick.y)) { dx = stick.x; dy = stick.y; }
    else {
      if (W.keys.left) dx -= 1;
      if (W.keys.right) dx += 1;
      if (W.keys.up) dy -= 1;
      if (W.keys.down) dy += 1;
    }
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len > 1) { dx /= len; dy /= len; }

    k.soul.x += dx * 78 * dt;
    k.soul.y += dy * 78 * dt;
    k.soul.x = Math.max(BOX.x + 6, Math.min(BOX.x + BOX.w - 6, k.soul.x));
    k.soul.y = Math.max(BOX.y + 6, Math.min(BOX.y + BOX.h - 6, k.soul.y));
  }

  function schuesseBewegen(dt) {
    for (var i = k.schuesse.length - 1; i >= 0; i--) {
      var s = k.schuesse[i];
      s.t += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (s.x < BOX.x - 20 || s.x > BOX.x + BOX.w + 20 ||
          s.y < BOX.y - 20 || s.y > BOX.y + BOX.h + 20) {
        k.schuesse.splice(i, 1);
        continue;
      }
      if (k.invuln <= 0) {
        var dx = s.x - k.soul.x, dy = s.y - k.soul.y;
        if (dx * dx + dy * dy < (s.r + 4) * (s.r + 4)) {
          k.invuln = 0.9;
          W.G.player.hp -= k.boss.dmg;
          W.G.shake = 4;
          if (W.A) W.A.hurt();
          if (W.G.player.hp <= 0) { W.G.player.hp = 0; k = null; W.onTod(); return; }
        }
      }
    }
  }

  /* --------- Takt --------- */

  function update(dt) {
    if (!k) return;
    k.anim += dt;
    k.invuln = Math.max(0, k.invuln - dt);
    if (k.zugFlash > 0) k.zugFlash -= dt;

    if (k.phase === 'text') {
      k.t += dt;
      if (k.t > 1.9) {
        if (k.ende) beenden(k.ende);
        else angriffStarten();
      }
    } else if (k.phase === 'balken') {
      k.barX += k.barRichtung * 200 * dt;
      if (k.barX > BOX.w) { k.barX = BOX.w; k.barRichtung = -1; }
      if (k.barX < 0) { k.barX = 0; k.barRichtung = 1; }
    } else if (k.phase === 'gegner') {
      k.t += dt;
      angriffMuster(dt);
      seeleBewegen(dt);
      schuesseBewegen(dt);
      if (!k) return;
      if (k.t > 6.5) {
        k.phase = 'menue';
        k.zugFlash = 1.3;                 /* "DEIN ZUG!" kurz einblenden */
        k.schuesse = [];
        k.text = k.runde <= 3
          ? 'Angriff vorbei - jetzt bist DU dran.\nKAEMPFEN bis sein Balken leer ist,\noder dreimal HANDELN und dann SCHONEN.'
          : k.boss.name + ' holt Luft. Du bist dran.';
      }
    }
  }

  /* Tippen und Tasten */
  function tippen(gx, gy) {
    if (!k) return false;

    if (k.phase === 'balken') { balkenStoppen(); return true; }
    if (k.phase === 'text') { k.t = 99; return true; }

    if (k.phase === 'untermenue') {
      for (var i = 0; i < k.untermenue.length; i++) {
        var y = BOX.y + 22 + i * 16;
        if (gy > y - 10 && gy < y + 8) { handlungWaehlen(i); return true; }
      }
      k.untermenue = null;                   /* daneben getippt: zurueck */
      k.phase = 'menue';
      return true;
    }

    if (k.phase === 'menue') {
      for (var j = 0; j < 4; j++) {
        var bx = 10 + j * 76;
        if (gx > bx && gx < bx + 72 && gy > 180 && gy < 206) { menueWaehlen(j); return true; }
      }
    }
    return true;
  }

  function taste(was) {
    if (!k) return;
    if (k.phase === 'balken') { balkenStoppen(); return; }
    if (k.phase === 'text') { k.t = 99; return; }
    if (k.phase === 'untermenue') {
      if (was === 'left') k.auswahl = Math.max(0, k.auswahl - 1);
      if (was === 'right') k.auswahl = Math.min(k.untermenue.length - 1, k.auswahl + 1);
      if (was === 'ok') handlungWaehlen(k.auswahl);
      return;
    }
    if (k.phase === 'menue') {
      if (was === 'left') k.auswahl = (k.auswahl + 3) % 4;
      if (was === 'right') k.auswahl = (k.auswahl + 1) % 4;
      if (was === 'ok') menueWaehlen(k.auswahl);
    }
  }

  /* --------- Zeichnen --------- */

  function rahmen(ctx, x, y, w, h, farbe) {
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = farbe || '#fff';
    ctx.fillRect(x, y, w, 2);
    ctx.fillRect(x, y + h - 2, w, 2);
    ctx.fillRect(x, y, 2, h);
    ctx.fillRect(x + w - 2, y, 2, h);
  }

  function draw() {
    if (!k) return;
    var ctx = W.ctx, VW = W.VW, VH = W.VH, G = W.G;

    ctx.fillStyle = '#05040a';
    ctx.fillRect(0, 0, VW, VH);

    /* Der Boss oben */
    var bild = W.bossBild(k.boss, Math.floor(k.anim * 4) % 2);
    var s = k.boss.art === 'treant' ? 1.4 : 2.2;
    var bw = bild.width * s, bh = bild.height * s;
    var by = 60 - bh;
    ctx.drawImage(bild, VW / 2 - bw / 2, Math.max(2, by), bw, bh);

    /* Name und Lebensbalken des Bosses */
    ctx.font = '8px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff9a8a';
    ctx.fillText(k.boss.name.toUpperCase(), VW / 2, 67);
    var bbw = 150, bbx = (VW - bbw) / 2;
    ctx.fillStyle = '#3b2028'; ctx.fillRect(bbx, 70, bbw, 5);
    ctx.fillStyle = '#e03a3a';
    ctx.fillRect(bbx, 70, bbw * Math.max(0, k.hp) / k.maxhp, 5);
    ctx.fillStyle = '#ff9a8a';
    ctx.fillRect(bbx, 70, bbw * Math.max(0, k.hp) / k.maxhp, 2);
    ctx.textAlign = 'left';

    /* Das Kampf-Fenster */
    rahmen(ctx, BOX.x, BOX.y, BOX.w, BOX.h);

    if (k.phase === 'gegner') {
      /* Geschosse */
      for (var i = 0; i < k.schuesse.length; i++) {
        var sch = k.schuesse[i];
        ctx.fillStyle = sch.farbe;
        if (sch.art === 'wurzel' || sch.art === 'faden') {
          ctx.fillRect(Math.round(sch.x - sch.r), Math.round(sch.y - sch.r * 2), sch.r * 2, sch.r * 4);
        } else {
          ctx.fillRect(Math.round(sch.x - sch.r), Math.round(sch.y - sch.r), sch.r * 2, sch.r * 2);
          ctx.fillStyle = '#fff';
          ctx.fillRect(Math.round(sch.x - 1), Math.round(sch.y - sch.r), 1, 2);
        }
      }
      /* Das rote Herz - das bist du */
      if (!(k.invuln > 0 && Math.floor(k.invuln * 14) % 2)) {
        ctx.drawImage(W.S.heart, Math.round(k.soul.x - 3), Math.round(k.soul.y - 3));
      }

      /* Wie lange greift er noch an? */
      var rest = Math.max(0, 1 - k.t / 6.5);
      ctx.fillStyle = '#2a2633';
      ctx.fillRect(BOX.x + 4, BOX.y + BOX.h - 6, BOX.w - 8, 3);
      ctx.fillStyle = '#8fd36a';
      ctx.fillRect(BOX.x + 4, BOX.y + BOX.h - 6, (BOX.w - 8) * rest, 3);

      /* Erklaerung, solange man noch neu ist */
      if (k.runde <= 2) {
        ctx.font = '8px "Courier New", monospace';
        ctx.fillStyle = '#ffd24a';
        ctx.textAlign = 'center';
        ctx.fillText('Joystick ziehen: dein rotes Herz ausweichen lassen!',
                     W.VW / 2, BOX.y + BOX.h + 11);
        ctx.textAlign = 'left';
      }
    } else if (k.phase === 'balken') {
      ctx.fillStyle = '#c8c2e0';
      ctx.font = '9px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Tippen, wenn der Zeiger in der Mitte ist!', W.VW / 2, BOX.y + 24);
      ctx.textAlign = 'left';
      /* Balken */
      ctx.fillStyle = '#2a2633';
      ctx.fillRect(BOX.x + 8, BOX.y + 44, BOX.w - 16, 22);
      ctx.fillStyle = '#4a4560';
      ctx.fillRect(BOX.x + BOX.w / 2 - 12, BOX.y + 44, 24, 22);
      ctx.fillStyle = '#ffd24a';
      ctx.fillRect(BOX.x + BOX.w / 2 - 2, BOX.y + 44, 4, 22);
      var zx = BOX.x + 8 + (k.barX / BOX.w) * (BOX.w - 16);
      ctx.fillStyle = '#fff';
      ctx.fillRect(Math.round(zx) - 1, BOX.y + 40, 3, 30);
    } else if (k.phase === 'untermenue') {
      ctx.font = '10px "Courier New", monospace';
      for (var j = 0; j < k.untermenue.length; j++) {
        var y = BOX.y + 22 + j * 16;
        ctx.fillStyle = (j === k.auswahl) ? '#ff5a5a' : '#000';
        if (j === k.auswahl) ctx.drawImage(W.S.heart, BOX.x + 10, y - 5);
        ctx.fillStyle = '#fff';
        ctx.fillText(k.untermenue[j].t, BOX.x + 24, y + 3);
      }
    } else {
      /* Text im Fenster */
      ctx.font = '10px "Courier New", monospace';
      ctx.fillStyle = '#fff';
      var zeilen = [];
      var absaetze = String(k.text || '').split('\n');
      for (var a = 0; a < absaetze.length; a++) {
        zeilen = zeilen.concat(umbrechen(absaetze[a], 40));
      }
      for (var z = 0; z < zeilen.length; z++) {
        ctx.fillText(zeilen[z], BOX.x + 10, BOX.y + 22 + z * 13);
      }
    }

    /* Kurz anzeigen, dass du wieder dran bist */
    if (k.zugFlash > 0 && k.phase === 'menue') {
      ctx.globalAlpha = Math.min(1, k.zugFlash);
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillStyle = '#ffd24a';
      ctx.textAlign = 'center';
      ctx.fillText('DEIN ZUG!', W.VW / 2, BOX.y + BOX.h - 14);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    /* Die vier Knoepfe */
    if (k.phase === 'menue') {
      ctx.font = '9px "Courier New", monospace';
      for (var n = 0; n < 4; n++) {
        var bx = 10 + n * 76;
        var aktiv = (n === k.auswahl);
        rahmen(ctx, bx, 180, 72, 26, aktiv ? '#ffd24a' : '#e8a54a');
        ctx.fillStyle = aktiv ? '#ffd24a' : '#e8a54a';
        ctx.textAlign = 'center';
        ctx.fillText(KNOEPFE[n], bx + 36, 197);
        ctx.textAlign = 'left';
      }
    }

    /* Deine Herzen */
    var herzen = Math.ceil(G.player.maxhp / 2);
    for (var h2 = 0; h2 < herzen; h2++) {
      var hx = 10 + h2 * 9, rest = G.player.hp - h2 * 2;
      ctx.globalAlpha = 0.25;
      ctx.drawImage(W.S.heart, hx, 214);
      ctx.globalAlpha = 1;
      if (rest >= 2) ctx.drawImage(W.S.heart, hx, 214);
      else if (rest === 1) ctx.drawImage(W.S.heart, 0, 0, 4, W.S.heart.height, hx, 214, 4, W.S.heart.height);
    }
    ctx.font = '8px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('HP ' + G.player.hp + '/' + G.player.maxhp, 14 + herzen * 9, 221);
    if (k.mercy >= k.mercyZiel) {
      ctx.fillStyle = '#ffd24a';
      ctx.textAlign = 'right';
      ctx.fillText('SCHONEN moeglich!', W.VW - 8, 221);
      ctx.textAlign = 'left';
    }
  }

  function umbrechen(text, max) {
    var worte = String(text || '').split(' '), zeilen = [], zeile = '';
    for (var i = 0; i < worte.length; i++) {
      var probe = zeile ? zeile + ' ' + worte[i] : worte[i];
      if (probe.length > max && zeile) { zeilen.push(zeile); zeile = worte[i]; }
      else zeile = probe;
    }
    if (zeile) zeilen.push(zeile);
    return zeilen;
  }

  global.Kampf = {
    init: function (welt) { W = welt; },
    start: start,
    update: update,
    draw: draw,
    tippen: tippen,
    taste: taste,
    aktiv: function () { return !!k; },
    /* nur zum Nachschauen (auch praktisch beim Testen) */
    stand: function () {
      return k ? { phase: k.phase, hp: k.hp, maxhp: k.maxhp, mercy: k.mercy, ende: k.ende } : null;
    }
  };
})(window);

</script>
<script>
/* game.js – Oakblade
   Ein kleines Pixel-Rollenspiel: Wald, Holzhaus, Familie, Freunde,
   Zombies, Schwertschlag-Animation und Autofahrt in die Stadt. */
(function (global) {
  'use strict';

  var TILE = 16, VW = 320, VH = 240;
  var FASSUNG = 18;                    /* steht unten auf dem Titelbild */
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var S = global.Sprites, MAPS = global.MAPS, D = global.Dialog, Chat = global.Chat;
  var A = global.Audio8;
  var Fx = global.Fx, Ge = global.Gegner;

  var ACT = {};                    /* fertige Laufbilder je Person */
  var G = {
    state: 'title',
    map: null, mapKey: '', mapW: 0, mapH: 0,
    ents: [], party: [], partyKeys: [], trail: [],
    player: null, camX: 0, camY: 0,
    kills: 0, time: 0, fade: 0, fadeTo: null,
    spawnT: 4, shake: 0, hint: '', hintT: 0,
    boss: null, bossQueue: [], bossesBeaten: 0, killsSinceBoss: 0,
    coins: 0, swordLevel: 0, armorLevel: 0,
    pilze: 0, beeren: 0, spared: 0, pets: 0, hundBonus: false,
    zeit: 0.28, quest: null, sammelT: 6,
    drive: null, overT: 0, lastSave: 0, maxhpGesichert: 10,
    karteOffen: false, entdeckt: null,
    kombo: 0, komboT: 0, komboBest: 0, serie: 0,
    welle: null, welleNr: 0, welleCd: 55, wirbel: 0, rollCd: 0, wut: 0
  };
  global.GAME = G;

  /* ================= Eingabe ================= */
  var keys = {}, tapped = {};
  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
    ' ': 'attack', Enter: 'talk', e: 'talk', E: 'talk',
    z: 'talk', Z: 'talk', x: 'attack', X: 'attack', j: 'attack', J: 'attack',
    m: 'karte', M: 'karte',
    Shift: 'rolle', c: 'rolle', C: 'rolle', q: 'rolle', Q: 'rolle'
  };

  global.addEventListener('keydown', function (e) {
    var k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    if (!keys[k]) tapped[k] = true;
    keys[k] = true;
  });
  global.addEventListener('keyup', function (e) {
    var k = KEYMAP[e.key];
    if (!k) return;
    e.preventDefault();
    keys[k] = false;
  });

  /* ================= Laufen =================
     Alles laeuft ueber den Joystick aus joystick.js. Ziehen laeuft,
     kurzes Tippen liest Texte weiter - mehr Eingaben gibt es nicht
     (ausser der Tastatur am Rechner). */
  var stick = null;

  function bindStick() {
    if (!global.Joystick) return;
    stick = new Joystick({
      radius: 60,
      deadZone: 0.18,

      /* Gelaufen (und im Kampf ausgewichen) wird, sobald das Spiel laeuft. */
      canStart: function () {
        return G.state === 'play' || G.state === 'over' || G.state === 'kampf';
      },

      /* Knoepfe und die Textbox behalten ihre eigenen Beruehrungen. */
      ignore: function (target) {
        if (!target || !target.closest) return false;
        return !!(target.closest('button') || target.closest('#box'));
      },

      /* Kurz getippt statt gezogen: Spiel starten oder weiterlesen. */
      onTap: function (x, y) {
        if (A) A.resume();
        if (G.state === 'title') { startGame(); return; }
        if (G.karteOffen) { G.karteOffen = false; return; }
        if (D.isOpen()) { D.press(); return; }
        if (G.state === 'kampf') {
          /* Bildschirmpunkt in Spielpunkte umrechnen */
          var r = cv.getBoundingClientRect();
          Kampf.tippen((x - r.left) / r.width * VW, (y - r.top) / r.height * VH);
          return;
        }
        if (G.state === 'drive') { tapped.talk = true; }
      }
    });
  }

  /* Richtung, in die der Ritter laufen soll: erst der Stick, sonst Tasten. */
  function laufRichtung() {
    var dx = 0, dy = 0;
    if (stick && stick.active && (stick.x !== 0 || stick.y !== 0)) {
      dx = stick.x;
      dy = stick.y;
    } else {
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
    }
    var laenge = Math.sqrt(dx * dx + dy * dy);
    if (laenge > 1) { dx /= laenge; dy /= laenge; }   /* nie schneller als 1 */
    return { x: dx, y: dy };
  }

  function bindTouch() {
    var btns = document.querySelectorAll('#touch button');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        var k = b.getAttribute('data-k');
        function on(e) { e.preventDefault(); if (!keys[k]) tapped[k] = true; keys[k] = true; if (A) A.resume(); }
        function off(e) { e.preventDefault(); keys[k] = false; }
        b.addEventListener('touchstart', on, { passive: false });
        b.addEventListener('touchend', off, { passive: false });
        b.addEventListener('touchcancel', off, { passive: false });
        b.addEventListener('mousedown', on);
        b.addEventListener('mouseup', off);
        b.addEventListener('mouseleave', off);
      })(btns[i]);
    }
  }

  function took(k) { if (tapped[k]) { tapped[k] = false; return true; } return false; }

  /* Die Lauf-Knöpfe nur zeigen, wenn man auch laufen darf. */
  var touchEl = null, controlsOn = null;
  function updateControls() {
    if (!touchEl) touchEl = document.getElementById('touch');
    var spielt = (G.state === 'play' || G.state === 'over');
    /* Im Kampf steuert der Stick das rote Herz - also auch dort zeigen. */
    if (stick) stick.setVisible(spielt || G.state === 'kampf');
    var show = spielt && !D.isOpen();
    if (show === controlsOn) return;
    controlsOn = show;
    touchEl.classList.toggle('off', !show);
    var autotext = document.getElementById('autotext');
    if (autotext) autotext.textContent = (G.mapKey === 'stadt') ? 'Wald' : 'Stadt';
    if (!show) {
      /* Finger weg vom Knopf: nichts darf gedrückt bleiben */
      for (var k in keys) keys[k] = false;
    }
  }

  /* ================= Karte laden ================= */
  function solidTile(ch) { return MAPS.SOLID.indexOf(ch) >= 0; }

  function tileAt(tx, ty) {
    if (ty < 0 || ty >= G.mapH || tx < 0 || tx >= G.mapW) return 'T';
    return G.map.rows[ty][tx];
  }

  function loadMap(key, tx, ty, after) {
    var m = MAPS[key]();
    G.map = m; G.mapKey = key;
    G.mapH = m.rows.length; G.mapW = m.rows[0].length;
    karteBild = S.karteBauen(m.rows);      /* kleines Bild der ganzen Karte */
    G.karteOffen = false;
    G.welle = null;
    G.kombo = 0; G.komboT = 0; G.serie = 0;
    if (Fx) Fx.leeren();
    G.ents = []; G.party = []; G.trail = [];
    G.boss = null;
    G.blocks = [];

    /* Bäume, Büsche und Steine aus den Kacheln zu Objekten machen */
    for (var y = 0; y < G.mapH; y++) {
      for (var x = 0; x < G.mapW; x++) {
        var ch = m.rows[y][x];
        if (ch === 'T') addProp('tree', x + 0.5, y + 1);
        else if (ch === 't') addProp('pine', x + 0.5, y + 1);
        else if (ch === '*') addProp('bush', x + 0.5, y + 1);
        else if (ch === 'r') addProp('rock', x + 0.5, y + 1);
      }
    }
    /* zusätzliche Objekte der Karte (Auto, Schild, Laternen) */
    for (var i = 0; i < m.props.length; i++) {
      var p = m.props[i];
      addProp(p.kind, p.x, p.y, p);
    }

    /* Spieler */
    if (!G.player) {
      var mh = Math.max(10, Math.min(20, G.maxhpGesichert || 10));
      G.player = { type: 'player', x: 0, y: 0, dir: 'down', anim: 0, moving: false,
                   hp: mh, maxhp: mh, atk: null, atkCd: 0, swingId: 0, invuln: 0, kx: 0, ky: 0 };
    }
    G.player.x = tx * TILE; G.player.y = ty * TILE;
    G.player.atk = null; G.player.kx = 0; G.player.ky = 0;
    G.ents.push(G.player);

    /* Begleiter, die gerade mitlaufen */
    for (i = 0; i < G.partyKeys.length; i++) {
      var c = makeCompanion(G.partyKeys[i], G.player.x - 10 - i * 4, G.player.y + 8 + i * 3);
      G.ents.push(c); G.party.push(c);
    }

    if (key === 'wald') {
      /* Freunde, die (noch) nicht mitkommen, stehen vorm Haus */
      var spots = m.friendSpots, fi = 0;
      var alle = ['lisbeth', 'tarik', 'momo', 'gris'];
      for (i = 0; i < alle.length; i++) {
        if (G.partyKeys.indexOf(alle[i]) >= 0) continue;
        var sp = spots[fi % spots.length]; fi++;
        var f = makeCompanion(alle[i], sp.x * TILE, sp.y * TILE);
        f.idle = true; f.dir = 'down';
        G.ents.push(f);
      }
    }

    if (key === 'haus') {
      addNPC('mama', 3.5, 4, 'down');
      addNPC('papa', 6.5, 7.2, 'up');
      addNPC('mila', 12.5, 9.2, 'left');
      var hund = addNPC('hund', 15.5, 5.5, 'down');
      hund.hund = true;
    }

    if (key === 'stadt') {
      for (i = 0; i < m.wanderSpots.length; i++) {
        var w = m.wanderSpots[i];
        var n = addNPC(w.wer || 'buerger', w.x, w.y, 'down');
        n.wander = true; n.wt = Math.random() * 2;
        n.line = Chat.cityLines[i % Chat.cityLines.length];
      }
      if (m.haendler) {
        var h = addNPC('haendler', m.haendler.x, m.haendler.y, 'down');
        h.shop = true;
      }
    }

    if (key === 'wald') {
      for (i = 0; i < 9; i++) sammelStueckSetzen();
    }

    G.spawnT = 3;
    if (A) A.music(m.music);
    hint(m.name);
    if (after) after();
  }

  function addProp(kind, x, y, data) {
    var spr = kind === 'tree' ? S.tree : kind === 'pine' ? S.pine : kind === 'bush' ? S.bush :
              kind === 'rock' ? S.rock : kind === 'lamp' ? S.lamp : kind === 'sign' ? S.sign :
              kind === 'car' ? S.car : kind === 'fountain' ? S.fountain :
              kind === 'bench' ? S.bench : kind === 'stall' ? S.stall :
              kind === 'grave' ? S.graves[(data && data.art) || 0] :
              kind === 'barrel' ? S.barrel : kind === 'fence' ? S.fence :
              kind === 'fire' ? S.fire[0] : null;
    var p = { type: 'prop', kind: kind, x: x * TILE, y: y * TILE, spr: spr,
              text: data && data.text, anim: Math.random() * 2 };
    G.ents.push(p);
    if (kind === 'car') G.blocks.push({ l: p.x - 20, r: p.x + 20, t: p.y - 12, b: p.y });
    if (kind === 'lamp') G.blocks.push({ l: p.x - 4, r: p.x + 4, t: p.y - 4, b: p.y });
    if (kind === 'sign') G.blocks.push({ l: p.x - 12, r: p.x + 12, t: p.y - 6, b: p.y });
    if (kind === 'fountain') G.blocks.push({ l: p.x - 16, r: p.x + 16, t: p.y - 14, b: p.y });
    if (kind === 'bench') G.blocks.push({ l: p.x - 10, r: p.x + 10, t: p.y - 5, b: p.y });
    if (kind === 'stall') G.blocks.push({ l: p.x - 17, r: p.x + 17, t: p.y - 10, b: p.y });
    if (kind === 'grave') G.blocks.push({ l: p.x - 5, r: p.x + 5, t: p.y - 6, b: p.y });
    if (kind === 'barrel') G.blocks.push({ l: p.x - 6, r: p.x + 6, t: p.y - 7, b: p.y });
    if (kind === 'fence') G.blocks.push({ l: p.x - 8, r: p.x + 8, t: p.y - 5, b: p.y });
    if (kind === 'fire') G.blocks.push({ l: p.x - 7, r: p.x + 7, t: p.y - 5, b: p.y });
    return p;
  }

  function makeCompanion(key, px, py) {
    return { type: 'friend', key: key, x: px, y: py, dir: 'down', anim: 0,
             moving: false, mood: 0, atkCd: 0, swing: 0, idle: false };
  }

  function addNPC(key, x, y, dir) {
    var n = { type: 'npc', key: key, x: x * TILE, y: y * TILE, dir: dir || 'down',
              anim: 0, moving: false, said: 0 };
    G.ents.push(n);
    return n;
  }

  function hint(text) { G.hint = text; G.hintT = 2.6; }

  /* ================= Laufen & Wände ================= */
  function boxFree(x, y) {
    var l = x - 5, r = x + 5, t = y - 7, b = y - 0.5;
    var i, j;
    for (i = 0; i < 2; i++) {
      for (j = 0; j < 2; j++) {
        var px = i ? r : l, py = j ? b : t;
        if (solidTile(tileAt(Math.floor(px / TILE), Math.floor(py / TILE)))) return false;
      }
    }
    for (i = 0; i < G.blocks.length; i++) {
      var bl = G.blocks[i];
      if (r > bl.l && l < bl.r && b > bl.t && t < bl.b) return false;
    }
    return true;
  }

  function moveEnt(e, dx, dy, ignoreBlocks) {
    var ox = e.x, oy = e.y;
    if (dx) {
      e.x += dx;
      if (!ignoreBlocks && !boxFree(e.x, e.y)) e.x = ox;
    }
    if (dy) {
      e.y += dy;
      if (!ignoreBlocks && !boxFree(e.x, e.y)) e.y = oy;
    }
    e.x = Math.max(8, Math.min(G.mapW * TILE - 8, e.x));
    e.y = Math.max(10, Math.min(G.mapH * TILE - 2, e.y));
  }

  function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }

  /* ================= Spieler ================= */
  var SPEED = 62;

  function updatePlayer(dt) {
    var p = G.player;
    p.invuln = Math.max(0, p.invuln - dt);
    p.atkCd = Math.max(0, p.atkCd - dt);

    var richtung = laufRichtung();
    var dx = richtung.x, dy = richtung.y;

    p.moving = !!(dx || dy);
    if (p.moving && !p.atk) {
      if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? 'right' : 'left';
      else p.dir = dy > 0 ? 'down' : 'up';
    }

    /* --- Ausweichrolle: schnell, kurz unverwundbar --- */
    G.rollCd = Math.max(0, G.rollCd - dt);
    if (p.roll) {
      p.roll.t += dt;
      p.invuln = Math.max(p.invuln, 0.08);
      if (p.roll.t % 0.05 < dt) Fx.staub(p.x, p.y);
      if (p.roll.t >= 0.28) { p.roll = null; }
    } else if (took('rolle') && !D.isOpen() && G.rollCd <= 0) {
      var rr = (dx || dy) ? { x: dx, y: dy }
                          : { x: p.dir === 'left' ? -1 : p.dir === 'right' ? 1 : 0,
                              y: p.dir === 'up' ? -1 : p.dir === 'down' ? 1 : 0 };
      p.roll = { t: 0, x: rr.x, y: rr.y };
      p.atk = null;
      p.invuln = Math.max(p.invuln, 0.34);
      G.rollCd = 0.75;
      Fx.ring(p.x, p.y - 7, 16, 'rgba(180,240,200,0.8)', 2);
      Fx.funken(p.x, p.y, 7, 'rgba(210,230,210,0.9)', 55);
      if (A) A.swing();
    }

    var sp = p.atk ? SPEED * 0.35 : SPEED;
    if (p.roll) {
      moveEnt(p, p.roll.x * SPEED * 3.1 * dt, p.roll.y * SPEED * 3.1 * dt);
    } else {
      moveEnt(p, dx * sp * dt, dy * sp * dt);
    }

    /* Staub beim Laufen */
    if (p.moving && !p.roll) {
      p.staubT = (p.staubT || 0) + dt;
      if (p.staubT > 0.14) { p.staubT = 0; Fx.staub(p.x, p.y); }
    }

    /* Rückstoß nach einem Treffer */
    if (p.kx || p.ky) {
      moveEnt(p, p.kx * dt, p.ky * dt);
      p.kx *= 0.86; p.ky *= 0.86;
      if (Math.abs(p.kx) < 3) p.kx = 0;
      if (Math.abs(p.ky) < 3) p.ky = 0;
    }

    p.anim += dt * (p.moving ? 7 : 0);

    /* Spur für die Begleiter */
    G.trail.unshift({ x: p.x, y: p.y, dir: p.dir, moving: p.moving });
    if (G.trail.length > 260) G.trail.pop();

    /* --- Schlagen ---
       Kurz tippen = normaler Hieb.
       Knopf gedrueckt halten = aufladen, loslassen = WIRBELSCHLAG rundum. */
    var getippt = took('attack');
    if (!D.isOpen() && !p.roll) {
      if (keys.attack && !p.atk && p.atkCd <= 0) {
        p.laden = (p.laden || 0) + dt;
        if (p.laden > 0.42) {
          /* waehrend des Aufladens funkt es um den Ritter */
          if (Math.random() < 0.4) {
            var la = Math.random() * Math.PI * 2;
            Fx.funken(p.x + Math.cos(la) * 14, p.y - 8 + Math.sin(la) * 10, 1, '#ffd24a', 20);
          }
        }
      } else if (!keys.attack && p.laden > 0) {
        if (p.laden > 0.42) wirbelSchlag();
        else hieb();
        p.laden = 0;
      } else if (getippt) {
        /* So kurz getippt, dass Druecken und Loslassen ins selbe Bild
           gefallen sind - sonst ginge der Schlag verloren. */
        hieb();
      }
    } else { p.laden = 0; }

    if (G.wirbel > 0) {
      G.wirbel -= dt;
      if (G.wirbel <= 0) { p.atk = null; p.atkCd = 0.18; }
    } else if (p.atk) {
      p.atk.t += dt;
      if (p.atk.t >= 0.05 && p.atk.t <= 0.20) hitCheck(p);
      if (p.atk.t >= 0.27) { p.atk = null; p.atkCd = 0.05; }
    }

    /* Türen */
    var tx = Math.floor(p.x / TILE), ty = Math.floor((p.y - 3) / TILE);
    var trg = G.map.triggers;
    for (var i = 0; i < trg.length; i++) {
      var t = trg[i];
      if (tx >= t.x && tx < t.x + t.w && ty >= t.y && ty < t.y + t.h) {
        useDoor(t);
        break;
      }
    }
  }

  function useDoor(t) {
    if (G.fadeTo) return;
    if (A) A.door();
    var fromHaus = (G.mapKey === 'haus');
    fadeTo(function () {
      loadMap(t.to, t.tx, t.ty);
      if (fromHaus && t.to === 'wald') askParty();
    });
  }

  function fadeTo(fn) { G.fadeTo = fn; G.fade = 0.001; }

  /* Trefferzone vor dem Ritter */
  function hitCheck(p) {
    var box;
    if (p.dir === 'right') box = { l: p.x + 2, r: p.x + 22, t: p.y - 16, b: p.y - 1 };
    else if (p.dir === 'left') box = { l: p.x - 22, r: p.x - 2, t: p.y - 16, b: p.y - 1 };
    else if (p.dir === 'down') box = { l: p.x - 12, r: p.x + 12, t: p.y - 6, b: p.y + 14 };
    else box = { l: p.x - 12, r: p.x + 12, t: p.y - 32, b: p.y - 12 };

    for (var i = 0; i < G.ents.length; i++) {
      var z = G.ents[i];
      if (z.type !== 'zombie' || z.dying || z.spared) continue;
      if (z.hitId === p.swingId) continue;
      if (z.x + 6 > box.l && z.x - 6 < box.r && z.y > box.t && z.y - 14 < box.b) {
        z.hitId = p.swingId;
        schlagTreffer(z, false);
      }
    }
  }

  /* Ein ganz normaler Schwertstreich */
  function hieb() {
    var p = G.player;
    if (p.atk || p.atkCd > 0) return;
    p.atk = { t: 0 };
    p.swingId++;
    if (A) A.swing();
  }

  /* WIRBELSCHLAG: einmal rundum, doppelter Schaden, alles fliegt weg */
  function wirbelSchlag() {
    var p = G.player;
    p.swingId++;
    p.atk = { t: 0, wirbel: true };
    G.wirbel = 0.42;
    G.shake = 6;
    Fx.ring(p.x, p.y - 8, 44, 'rgba(255,230,140,0.95)', 3);
    Fx.ring(p.x, p.y - 8, 30, 'rgba(255,255,255,0.8)', 2);
    Fx.funken(p.x, p.y - 8, 22, '#ffd24a', 150);
    Fx.text(p.x, p.y - 30, 'WIRBEL!', '#ffd24a', true);
    if (A) { A.swing(); A.hit(); }

    var getroffen = 0;
    for (var i = 0; i < G.ents.length; i++) {
      var z = G.ents[i];
      if (z.type !== 'zombie' || z.dying || z.spared) continue;
      if (dist(z, p) < 38) { z.hitId = p.swingId; schlagTreffer(z, true); getroffen++; }
    }
    if (getroffen >= 3) Fx.text(p.x, p.y - 42, getroffen + ' AUF EINMAL!', '#ff8a3a', true);
  }

  /* Ein Schwerttreffer mit allem Drum und Dran */
  function schlagTreffer(z, wirbel) {
    var p = G.player;
    var grund = 1 + G.swordLevel;
    var komboBonus = Math.floor(G.kombo / 3);
    var krit = Math.random() < (0.1 + G.swordLevel * 0.04);
    var dmg = grund + komboBonus;
    if (wirbel) dmg = Math.round(dmg * 1.8);
    if (krit) dmg *= 2;
    if (G.wut > 0) dmg *= 2;

    G.kombo++;
    G.komboT = 2.4;
    if (G.kombo > G.komboBest) G.komboBest = G.kombo;
    if (G.quest && G.quest.art === 'kombo' && !G.quest.fertig && G.kombo > G.quest.stand) {
      questFortschritt('kombo', G.kombo - G.quest.stand);
    }

    Fx.stop(krit ? 0.09 : 0.05);
    G.shake = Math.max(G.shake, krit ? 7 : 3.5);
    if (krit) Fx.blitz(0.09, '#fff');

    var art = Ge.arten[z.art] || Ge.arten.normal;
    Fx.spritzer(z.x, z.y - 9, krit ? 16 : 9, art.fetzen, z.x - p.x, z.y - p.y);
    Fx.ring(z.x, z.y - 9, krit ? 22 : 14, krit ? 'rgba(255,220,120,0.95)' : 'rgba(255,255,255,0.8)', krit ? 3 : 2);
    Fx.text(z.x, z.y - 22, krit ? dmg + '!' : dmg, krit ? '#ffd24a' : '#fff', krit);
    if (krit) Fx.text(z.x, z.y - 34, 'VOLLTREFFER', '#ff8a3a', false);

    damageZombie(z, dmg, z.x - p.x, z.y - p.y);
  }

  function damageZombie(z, dmg, dx, dy) {
    var art = Ge.arten[z.art] || Ge.arten.normal;
    z.hp -= dmg;
    z.flash = 0.18;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var wucht = 140 * (art.wucht === undefined ? 1 : art.wucht);
    z.kx = dx / len * wucht; z.ky = dy / len * wucht;
    if (G.shake < 2.5) G.shake = 2.5;
    if (z.hp <= 0) {
      z.dying = 0.001;
      if (A) A.dead();
      Fx.spritzer(z.x, z.y - 9, 18, art.fetzen, dx, dy);
      Fx.funken(z.x, z.y - 9, 10, '#ffffff', 70);
      if (z.boss) {
        muenzenAbwerfen(z.x, z.y - 8, 12 + ((Math.random() * 8) | 0));
        bossBesiegt(z);
      } else {
        var mz = art.muenzen || [1, 3];
        var anzahl = mz[0] + ((Math.random() * (mz[1] - mz[0] + 1)) | 0);
        anzahl += Math.floor(G.kombo / 4);
        muenzenAbwerfen(z.x, z.y - 8, anzahl * (istNacht() ? 2 : 1));
        beuteAbwerfen(z);
        G.kills++;
        G.killsSinceBoss++;
        G.serie++;
        G.killsHeute = (G.killsHeute || 0) + 1;
        questFortschritt('zombies', 1);
        serienRuf();
        if (G.welle) welleZaehlen();
        if (G.killsHeute === 3) hint('Genug gekaempft? Der Auto-Knopf bringt euch in die Stadt!');
        Chat.killLine(G);
        save();
      }
    } else if (A) A.hit();
  }

  /* Ruft "3er SERIE!" und aehnliches aus */
  function serienRuf() {
    for (var i = Ge.serien.length - 1; i >= 0; i--) {
      if (G.serie === Ge.serien[i].n) {
        Fx.text(G.player.x, G.player.y - 40, Ge.serien[i].t, Ge.serien[i].f, true);
        Fx.blitz(0.07, Ge.serien[i].f);
        if (A) A.coin();
        return;
      }
    }
  }

  /* ================= Zombies ================= */

  /* Baut einen Zombie einer bestimmten Sorte */
  function zombieBauen(art, x, y) {
    var a = Ge.arten[art] || Ge.arten.normal;
    return { type: 'zombie', art: art, x: x, y: y,
             hp: a.hp, maxhpZ: a.hp, dir: 'down', anim: 0,
             kx: 0, ky: 0, flash: 0, dying: 0, hitId: -1, wt: 0, vx: 0, vy: 0,
             hurtCd: 0, spuckCd: 1 + Math.random() * 2, blinzelCd: 2 + Math.random() * 2,
             sprintCd: Math.random() * 2, sprint: 0 };
  }

  /* Freier Platz irgendwo auf der Karte, weit genug weg vom Ritter */
  function freierPlatz(minAbstand, maxAbstand) {
    var tries = 70;
    while (tries--) {
      var tx = 2 + ((Math.random() * (G.mapW - 4)) | 0);
      var ty = 2 + ((Math.random() * (G.mapH - 4)) | 0);
      if (solidTile(tileAt(tx, ty))) continue;
      var x = tx * TILE + 8, y = ty * TILE + 14;
      var dx = x - G.player.x, dy = y - G.player.y;
      var dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < minAbstand) continue;
      if (maxAbstand && dd > maxAbstand) continue;
      if (ty < 12 && tx < 22) continue;                 /* nicht direkt am Haus */
      return { x: x, y: y };
    }
    return null;
  }

  function spawnZombie(art, minAbstand, maxAbstand) {
    var pl = freierPlatz(minAbstand || 160, maxAbstand || 0);
    if (!pl) return null;
    if (!art) art = Ge.wuerfelArt(G.kills, istNacht(), !!G.welle);
    var z = zombieBauen(art, pl.x, pl.y);
    G.ents.push(z);
    /* Kriecher kommen nie allein */
    var a = Ge.arten[art];
    if (a && a.rudel) {
      for (var i = 1; i < a.rudel; i++) {
        G.ents.push(zombieBauen(art, pl.x + (Math.random() - 0.5) * 26,
                                     pl.y + (Math.random() - 0.5) * 26));
      }
    }
    /* Nachtschatten tauchen mit einer kleinen Rauchwolke auf */
    if (a && a.blinzelt) Fx.funken(z.x, z.y - 8, 10, '#6a6aff', 60);
    return z;
  }

  G.zombieNear = function (r) {
    for (var i = 0; i < G.ents.length; i++) {
      var z = G.ents[i];
      if (z.type === 'zombie' && !z.dying && dist(z, G.player) < r) return true;
    }
    return false;
  };

  function countZombies() {
    var n = 0;
    for (var i = 0; i < G.ents.length; i++) if (G.ents[i].type === 'zombie' && !G.ents[i].dying) n++;
    return n;
  }

  function updateZombie(z, dt) {
    if (z.dying) {
      z.dying += dt;
      return;
    }
    /* Verschont: er trollt sich friedlich davon */
    if (z.spared) {
      z.leaving -= dt;
      moveEnt(z, z.vx * 32 * dt, z.vy * 32 * dt);
      z.anim += dt * 3;
      if (Math.abs(z.vx) > Math.abs(z.vy)) z.dir = z.vx > 0 ? 'right' : 'left';
      else z.dir = z.vy > 0 ? 'down' : 'up';
      if (z.leaving <= 0) z.dying = 0.02;
      return;
    }
    if (D.isOpen()) { z.flash = Math.max(0, z.flash - dt); return; }
    z.flash = Math.max(0, z.flash - dt);
    z.hurtCd = Math.max(0, z.hurtCd - dt);

    var p = G.player;
    var dx = p.x - z.x, dy = p.y - z.y;
    var dd = Math.sqrt(dx * dx + dy * dy) || 1;
    var sp = 0;

    if (z.boss) { updateBoss(z, dt, dx, dy, dd); return; }

    var a = Ge.arten[z.art] || Ge.arten.normal;

    /* --- Spucker: bleibt auf Abstand und spuckt Saeure --- */
    if (a.spuckt) {
      z.spuckCd -= dt;
      if (dd < a.jagd) {
        z.vx = dx / dd; z.vy = dy / dd;
        if (dd < a.abstand) { z.vx = -z.vx; z.vy = -z.vy; sp = a.tempo; }
        else if (dd > a.abstand + 24) sp = a.tempo;
        else sp = 0;
        if (z.spuckCd <= 0) {
          z.spuckCd = 1.9 + Math.random() * 0.8;
          schussSetzen(z.x, z.y - 8, dx / dd, dy / dd, 78, 'saeure');
          Fx.funken(z.x, z.y - 8, 5, '#9aff6a', 40);
        }
      } else {
        sp = herumlaufen(z, dt, a);
      }
    }
    /* --- Renner: kurze, schnelle Sprints --- */
    else if (a.sprint) {
      z.sprintCd -= dt;
      if (dd < a.jagd) {
        z.vx = dx / dd; z.vy = dy / dd;
        if (z.sprint > 0) {
