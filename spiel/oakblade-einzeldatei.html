<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0a10">
<title>Oakblade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
* { box-sizing: border-box; }
/* Muss ueber .act stehen, sonst zeigt sich der Zorn-Knopf immer */
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: #07060c;
  color: #fff;
  font-family: "Courier New", ui-monospace, monospace;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#wrap {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative;
  width: 320px; height: 240px;
  transform-origin: center center;
}

#game {
  display: block;
  width: 320px; height: 240px;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Textbox im Undertale-Stil ---------- */
#box {
  position: absolute;
  left: 6px; right: 6px; bottom: 6px;
  min-height: 62px;
  background: #000;
  border: 3px solid #fff;
  padding: 5px 7px 6px;
  display: none;
  pointer-events: auto;
}
#box.on { display: block; }

#who {
  font-size: 8px; letter-spacing: 1px;
  color: #ffd24a; margin-bottom: 3px;
  text-transform: uppercase;
}
#txt {
  font-size: 10px; line-height: 13px;
  color: #fff; white-space: pre-wrap; word-break: break-word;
  min-height: 26px;
}
#opts { margin-top: 3px; }
.opt {
  position: relative;
  font-size: 10px; line-height: 13px;
  padding-left: 11px; color: #dcdcdc; cursor: pointer;
}
.opt.sel { color: #fff; }
.opt.sel::before {
  content: "♥"; position: absolute; left: 0; top: 0; color: #ff5a5a;
}
#more {
  position: absolute; right: 6px; bottom: 2px;
  font-size: 9px; color: #fff; display: none;
}
#more.on { display: block; animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- Knöpfe ---------- */
#sound {
  position: fixed; top: 8px; right: 8px;
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid #4a4560; background: #14121c; color: #ffd24a;
  font-size: 15px; line-height: 1; cursor: pointer; z-index: 5;
}
#sound.off { color: #5a5670; }

#mapbtn {
  position: fixed; top: 48px; right: 8px;
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid #4a7fb8; background: #14121c; color: #9fd0f0;
  font-size: 15px; line-height: 1; cursor: pointer; z-index: 5;
}

/* ---------- Steuerkreuz und Knöpfe: immer da ---------- */
#touch {
  display: block;
  position: fixed; inset: auto 0 0 0; height: 160px;
  z-index: 4; pointer-events: none;
}
/* Beim Reden und auf dem Titelbild stören die Knöpfe nur */
#touch.off { display: none; }
#abtn {
  position: absolute; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: flex-end; pointer-events: auto;
}
.act {
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(30,28,44,.82); border: 2px solid #4a4560;
  color: #cfc9e6; font-size: 17px; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.act.big { width: 74px; height: 74px; border-color: #b8453f; color: #ff9a8a; font-size: 22px; }
.act.auto { border-color: #e8a54a; color: #ffd24a; }
.act.karte { border-color: #4a7fb8; color: #9fd0f0; }
.act.rolle { border-color: #6ab87f; color: #9fe0b0; }
.act.heil { border-color: #d84a6a; color: #ff9ab0; }
.act.heil.leer { border-color: #3a3444; color: #55506a; }
.act.zorn {
  border-color: #ffd24a; color: #ffe89a;
  box-shadow: 0 0 10px rgba(255,210,74,.7);
  animation: zornpuls .8s ease-in-out infinite;
}
@keyframes zornpuls { 50% { box-shadow: 0 0 18px rgba(255,210,74,1); } }
.act small { font-size: 7px; opacity: .75; margin-top: 2px; }
.act:active { background: #3b3660; }

/* Auf schmalen Bildschirmen ruecken die vier Knoepfe zusammen */
@media (max-width: 860px) {
  #abtn { right: 6px; gap: 4px; }
  .act { width: 42px; height: 42px; font-size: 12px; }
  .act.big { width: 54px; height: 54px; font-size: 16px; }
  .act small { font-size: 6px; margin-top: 1px; }
}

/* Mit Maus und Tastatur halten sich die Knöpfe zurück */
@media (pointer: fine) {
  #abtn { opacity: .55; transition: opacity .2s; }
  #abtn:hover { opacity: 1; }
}

</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="240"></canvas>

    <div id="ui">
      <!-- Undertale-artige Textbox -->
      <div id="box">
        <div id="who"></div>
        <div id="txt"></div>
        <div id="opts"></div>
        <div id="more">▼</div>
      </div>
    </div>
  </div>
</div>

<button id="sound" title="Musik an/aus">♪</button>

<button id="mapbtn" data-k="karte" title="Karte">&#128506;</button>

<div id="touch">
  <div id="abtn">
    <button class="act zorn" data-k="zorn" hidden>&#9889;<small>ZORN</small></button>
    <button class="act auto" data-k="auto">&#128663;<small id="autotext">Stadt</small></button>
    <button class="act" data-k="talk">E<small>reden</small></button>
    <button class="act heil" data-k="heil">&#10084;<small id="heiltext">3</small></button>
    <button class="act rolle" data-k="rolle">&#128168;<small>Rolle</small></button>
    <button class="act big" data-k="attack">⚔<small>schlagen</small></button>
  </div>
</div>

<script>
/* joystick.js – Virtueller Joystick im Brawl-Stars-Stil.

   Finger irgendwo aufsetzen: der Stick erscheint genau dort und folgt dem
   Daumen. Loslassen blendet ihn wieder aus.

   Wichtig: Es wird sowohl auf Finger- (touch) als auch auf Maus-Ereignisse
   gehorcht. Nur auf "pointer"-Ereignisse zu bauen hat sich als unzuverlässig
   erwiesen – in manchen Umgebungen kommen sie nicht an.

   Ein kurzes Tippen ohne Ziehen ist kein Laufen, sondern ein Tipp: dafür
   gibt es `onTap` (das Spiel liest damit Texte weiter).
*/
(function (global) {
  'use strict';

  class Joystick {

    constructor(options) {
      var o = options || {};
      this.radius = o.radius || 60;
      this.deadZone = o.deadZone != null ? o.deadZone : 0.18;
      this.canStart = o.canStart || function () { return true; };
      this.ignore = o.ignore || function () { return false; };
      this.onTap = o.onTap || null;

      this.x = 0;              // -1 .. 1  (links/rechts)
      this.y = 0;              // -1 .. 1  (oben/unten, + = runter)
      this.active = false;     // Finger liegt auf und der Stick ist sichtbar
      this.used = false;       // schon einmal benutzt (für den Hinweis)

      this._touchId = null;    // welcher Finger zieht gerade
      this._lastTouch = 0;     // wann zuletzt ein Finger/Pointer kam
      this.visible = false;    // wird vom Spiel ein- und ausgeschaltet
      this._down = false;      // Finger liegt auf (auch wenn kein Stick)
      this._origin = { x: 0, y: 0 };
      this._moved = 0;
      this._start = 0;

      var zone = o.zone || document.body;

      this.base = document.createElement('div');
      this.base.style.cssText =
        'position:fixed;width:' + (this.radius * 2) + 'px;height:' + (this.radius * 2) + 'px;' +
        'border-radius:50%;background:rgba(30,28,44,.55);' +
        'border:3px solid rgba(207,201,230,.75);pointer-events:none;' +
        'display:none;z-index:9999;transform:translate(-50%,-50%);';

      this.knob = document.createElement('div');
      this.knob.style.cssText =
        'position:fixed;width:' + this.radius + 'px;height:' + this.radius + 'px;' +
        'border-radius:50%;background:rgba(150,142,205,.9);' +
        'border:3px solid rgba(255,255,255,.85);pointer-events:none;' +
        'display:none;z-index:10000;transform:translate(-50%,-50%);';

      document.body.appendChild(this.base);
      document.body.appendChild(this.knob);

      zone.style.touchAction = 'none';
      document.documentElement.style.touchAction = 'none';

      var self = this;
      global.addEventListener('resize', function () {
        if (!self._down) self._zeigeRuheplatz();
      });

      this._listen(zone);
    }

    /* ---- Ereignisse ----------------------------------------------------
       Es wird auf ALLE Arten gehorcht: pointer, touch und Maus. Welche ein
       Geraet schickt, ist von Browser zu Browser verschieden - und manche
       schicken die eine zum Anfassen und die andere zum Ziehen. Deshalb
       darf jede Art jede laufende Beruehrung fortsetzen; doppelte Meldungen
       schreiben einfach denselben Wert und stoeren nicht.
       Nur echte Maus-Echos nach einer Fingerberuehrung werden verworfen. */
    _listen(zone) {
      var self = this;

      function istEcho(art) {
        return art === 'maus' && (Date.now() - self._lastTouch) < 900;
      }
      function merken(art) {
        if (art !== 'maus') self._lastTouch = Date.now();
      }

      /* 1) Pointer */
      if (global.PointerEvent) {
        zone.addEventListener('pointerdown', function (e) {
          merken('pointer');
          self._begin(e, e, null);
        });
        global.addEventListener('pointermove', function (e) {
          merken('pointer');
          self._drag(e);
        });
        global.addEventListener('pointerup', function () { merken('pointer'); self._stop(); });
        global.addEventListener('pointercancel', function () { merken('pointer'); self._stop(); });
      }

      /* 2) Finger */
      zone.addEventListener('touchstart', function (e) {
        var t = e.changedTouches[0];
        if (!t) return;
        merken('touch');
        self._begin(t, e, t.identifier);
      }, { passive: false });

      global.addEventListener('touchmove', function (e) {
        merken('touch');
        var t = self._passenderFinger(e.changedTouches);
        if (!t) return;
        self._drag(t);
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      var fingerWeg = function (e) {
        merken('touch');
        if (self._touchId === null || self._passenderFinger(e.changedTouches)) self._stop();
      };
      global.addEventListener('touchend', fingerWeg);
      global.addEventListener('touchcancel', fingerWeg);

      /* 3) Maus */
      zone.addEventListener('mousedown', function (e) {
        if (istEcho('maus')) return;
        self._begin(e, e, null);
      });
      global.addEventListener('mousemove', function (e) {
        if (istEcho('maus')) return;
        self._drag(e);
      });
      global.addEventListener('mouseup', function () {
        if (istEcho('maus')) return;
        self._stop();
      });

      global.addEventListener('blur', function () { self.release(); });
    }

    /* Der Stick sitzt in Ruhe unten links - damit man ihn sieht. */
    _ruheplatz() {
      return { x: 30 + this.radius, y: global.innerHeight - 30 - this.radius };
    }

    _zeigeRuheplatz() {
      if (!this.visible) return;
      var platz = this._ruheplatz();
      this.base.style.left = this.knob.style.left = platz.x + 'px';
      this.base.style.top = this.knob.style.top = platz.y + 'px';
      this.base.style.display = this.knob.style.display = 'block';
      this.base.style.opacity = this.knob.style.opacity = '0.45';
    }

    /* Das Spiel sagt, wann gelaufen werden darf. */
    setVisible(sichtbar) {
      if (sichtbar === this.visible) return;
      this.visible = sichtbar;
      if (!sichtbar) {
        this.release();
        this.base.style.display = this.knob.style.display = 'none';
      } else {
        this._zeigeRuheplatz();
      }
    }

    /* Der Finger, der den Stick angefasst hat (falls bekannt). */
    _passenderFinger(liste) {
      if (this._touchId === null) return liste[0] || null;
      for (var i = 0; i < liste.length; i++) {
        if (liste[i].identifier === this._touchId) return liste[i];
      }
      return null;
    }

    _begin(point, event, touchId) {
      if (this._down) return;
      if (this.ignore(point.target)) return;        // Knöpfe haben Vorrang

      this._down = true;
      this._touchId = (touchId === undefined) ? null : touchId;
      this._origin = { x: point.clientX, y: point.clientY };
      this._lastX = point.clientX;
      this._lastY = point.clientY;
      this._moved = 0;
      this._start = Date.now();

      if (this.canStart()) {
        this.active = true;
        this.used = true;
        this.base.style.left = this.knob.style.left = point.clientX + 'px';
        this.base.style.top = this.knob.style.top = point.clientY + 'px';
        this.base.style.display = this.knob.style.display = 'block';
        this.base.style.opacity = this.knob.style.opacity = '1';
      }
      if (event && event.cancelable) event.preventDefault();
    }

    _drag(point) {
      if (!this._down) return;

      this._lastX = point.clientX;
      this._lastY = point.clientY;
      var dx = point.clientX - this._origin.x;
      var dy = point.clientY - this._origin.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > this._moved) this._moved = dist;
      if (!this.active) return;

      if (dist > this.radius) {
        dx = dx / dist * this.radius;
        dy = dy / dist * this.radius;
      }
      this.knob.style.left = (this._origin.x + dx) + 'px';
      this.knob.style.top = (this._origin.y + dy) + 'px';

      var nx = dx / this.radius, ny = dy / this.radius;
      if (Math.sqrt(nx * nx + ny * ny) < this.deadZone) { this.x = 0; this.y = 0; }
      else { this.x = nx; this.y = ny; }
    }

    _stop() {
      if (!this._down) return;
      var kurz = this._moved < 14 && (Date.now() - this._start) < 600;
      this.release();
      if (kurz && this.onTap) this.onTap(this._lastX, this._lastY);   // getippt statt gezogen
    }

    /* Alles loslassen – auch von aussen aufrufbar. */
    release() {
      this._down = false;
      this.active = false;
      this._touchId = null;
      this.x = this.y = 0;
      if (this.visible) this._zeigeRuheplatz();
      else this.base.style.display = this.knob.style.display = 'none';
    }

    get angle() { return Math.atan2(this.y, this.x); }
    get distance() { return Math.min(1, Math.sqrt(this.x * this.x + this.y * this.y)); }
  }

  global.Joystick = Joystick;
})(window);

</script>
<script>
/* effekte.js – alles, was knallt: Pixelfetzen, Schadenszahlen,
   Schlagringe und die kurze Trefferpause (hit stop).
   Nichts davon kennt das Spiel – es wird nur aufgerufen. */
(function (global) {
  'use strict';

  var teile = [];     /* fliegende Pixel */
  var texte = [];     /* Zahlen und Rufe, die nach oben steigen */
  var ringe = [];     /* Schockwellen */
  var stopT = 0;      /* so lange steht die Welt beim Treffer still */
  var blitzT = 0, blitzFarbe = '#fff';

  var MAX = 220;      /* mehr Pixel gleichzeitig braucht kein Mensch */

  function push(t) {
    if (teile.length >= MAX) teile.shift();
    teile.push(t);
  }

  /* ---------- Pixelfetzen ---------- */
  function funken(x, y, n, farbe, kraft) {
    kraft = kraft || 90;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = kraft * (0.35 + Math.random() * 0.9);
      push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
             g: 210, t: 0, leben: 0.32 + Math.random() * 0.4,
             f: farbe || '#fff', gr: Math.random() < 0.3 ? 2 : 1 });
    }
  }

  /* Fetzen in eine Richtung – fuer Treffer */
  function spritzer(x, y, n, farbe, dx, dy) {
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= len; dy /= len;
    for (var i = 0; i < n; i++) {
      var streu = (Math.random() - 0.5) * 1.5;
      var vx = dx * Math.cos(streu) - dy * Math.sin(streu);
      var vy = dx * Math.sin(streu) + dy * Math.cos(streu);
      var s = 60 + Math.random() * 130;
      push({ x: x, y: y, vx: vx * s, vy: vy * s - 40,
             g: 240, t: 0, leben: 0.3 + Math.random() * 0.35,
             f: farbe || '#8fd36a', gr: Math.random() < 0.35 ? 2 : 1 });
    }
  }

  /* Staubwoelkchen unter den Fuessen */
  function staub(x, y) {
    push({ x: x + (Math.random() - 0.5) * 6, y: y, vx: (Math.random() - 0.5) * 18,
           vy: -6 - Math.random() * 10, g: 20, t: 0, leben: 0.35,
           f: 'rgba(200,190,170,0.55)', gr: 1 });
  }

  /* Glutstaub in der Nacht, Bluetenblaetter am Tag */
  function schweben(x, y, farbe) {
    push({ x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: -4 - Math.random() * 8,
           g: -4, t: 0, leben: 1.6 + Math.random(), f: farbe, gr: 1, flimmer: true });
  }

  /* ---------- Zahlen und Rufe ---------- */
  function text(x, y, s, farbe, gross) {
    texte.push({ x: x, y: y, s: '' + s, f: farbe || '#fff',
                 t: 0, leben: gross ? 1.1 : 0.75, gross: !!gross,
                 vy: gross ? -22 : -30, vx: (Math.random() - 0.5) * 14 });
  }

  /* ---------- Schockwelle ---------- */
  function ring(x, y, r, farbe, dick) {
    ringe.push({ x: x, y: y, r0: 2, r1: r, t: 0, leben: 0.26,
                 f: farbe || 'rgba(255,255,255,0.9)', d: dick || 2 });
  }

  /* ---------- Trefferpause und Blitz ---------- */
  function stop(s) { if (s > stopT) stopT = s; }
  function blitz(s, farbe) { blitzT = Math.max(blitzT, s); blitzFarbe = farbe || '#fff'; }
  function wartet() { return stopT > 0; }

  function leeren() { teile.length = 0; texte.length = 0; ringe.length = 0; stopT = 0; blitzT = 0; }

  /* ---------- Rechnen ---------- */
  function update(dt) {
    if (stopT > 0) { stopT = Math.max(0, stopT - dt); }
    blitzT = Math.max(0, blitzT - dt);
    var i, p;
    for (i = teile.length - 1; i >= 0; i--) {
      p = teile[i];
      p.t += dt;
      if (p.t >= p.leben) { teile.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.vx *= 0.97;
    }
    for (i = texte.length - 1; i >= 0; i--) {
      p = texte[i];
      p.t += dt;
      if (p.t >= p.leben) { texte.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy *= 0.92;
    }
    for (i = ringe.length - 1; i >= 0; i--) {
      p = ringe[i];
      p.t += dt;
      if (p.t >= p.leben) ringe.splice(i, 1);
    }
  }

  /* ---------- Zeichnen (in Weltkoordinaten) ---------- */
  function draw(ctx, camX, camY) {
    var i, p, k;
    for (i = 0; i < ringe.length; i++) {
      p = ringe[i];
      k = p.t / p.leben;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = p.f;
      ctx.lineWidth = p.d;
      ctx.beginPath();
      ctx.arc(Math.round(p.x - camX), Math.round(p.y - camY),
              p.r0 + (p.r1 - p.r0) * k, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < teile.length; i++) {
      p = teile[i];
      k = p.t / p.leben;
      ctx.globalAlpha = p.flimmer ? (0.35 + 0.5 * Math.abs(Math.sin(p.t * 9))) * (1 - k)
                                  : Math.min(1, 2.2 - k * 2.2);
      ctx.fillStyle = p.f;
      ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), p.gr, p.gr);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    for (i = 0; i < texte.length; i++) {
      p = texte[i];
      k = p.t / p.leben;
      ctx.globalAlpha = Math.min(1, 2.4 - k * 2.4);
      ctx.font = (p.gross ? 'bold 11px' : 'bold 9px') + ' "Courier New", monospace';
      var tx = Math.round(p.x - camX), ty = Math.round(p.y - camY);
      ctx.fillStyle = '#000';
      ctx.fillText(p.s, tx + 1, ty + 1);
      ctx.fillStyle = p.f;
      ctx.fillText(p.s, tx, ty);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  /* Weisser Blitz ueber dem ganzen Bild */
  function drawBlitz(ctx, VW, VH) {
    if (blitzT <= 0) return;
    ctx.globalAlpha = Math.min(0.6, blitzT * 3);
    ctx.fillStyle = blitzFarbe;
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }

  global.Fx = {
    funken: funken, spritzer: spritzer, staub: staub, schweben: schweben,
    text: text, ring: ring, stop: stop, blitz: blitz, wartet: wartet,
    update: update, draw: draw, drawBlitz: drawBlitz, leeren: leeren,
    anzahl: function () { return teile.length; }
  };
})(window);

</script>
<script>
/* gegner.js – die Zombiesorten und die Wellen.
   Hier stehen nur die Daten; wie sie sich bewegen, steht in game.js. */
(function (global) {
  'use strict';

  /* Jede Sorte hat eine eigene Farbpalette, damit man sie sofort erkennt. */
  var ARTEN = {
    normal: {

  /* Der Ritter in besserer Ruestung und mit besserem Schwert */
  var RUESTUNGEN = [
    { a: '#d3dbe8', b: '#9aa4b8', c: '#646e82' },   /* Eisen */
    { a: '#e8c48a', b: '#b3853f', c: '#7a5a28' },   /* Bronze */
    { a: '#eaf1fb', b: '#b6c2d6', c: '#7d8a9e' },   /* Silber */
    { a: '#ffe08a', b: '#d8a43a', c: '#96702a' }    /* Gold */
  ];
  var KLINGEN = [
    { w: '#eef3fb', g: '#aab6c8' },
    { w: '#ffffff', g: '#c4cedd' },
    { w: '#dff0ff', g: '#9ec6e8' },
    { w: '#ffe8a0', g: '#d8a43a' }
  ];

  var knightCache = {}, swordCache = {};

  function knightFor(stufe) {
    stufe = Math.max(0, Math.min(RUESTUNGEN.length - 1, stufe || 0));
    if (knightCache[stufe]) return knightCache[stufe];
    var r = RUESTUNGEN[stufe];
    var pal = {
      o: KP.o, a: r.a, b: r.b, c: r.c, t: KP.t, u: KP.u,
      s: KP.s, r: KP.r, k: KP.k, n: KP.n
    };
    var side = [sprite(knightSide, pal), sprite(knightSide2, pal)];
    knightCache[stufe] = {
      down: [sprite(knightDown, pal), sprite(knightDown2, pal)],
      up: [sprite(knightUp, pal), sprite(knightUp2, pal)],
      right: side,
      left: [flipX(side[0]), flipX(side[1])]
    };
    return knightCache[stufe];
  }

  /* Die Freunde sind jetzt auch Ritter - jeder in seiner eigenen Farbe.
     rue = Ruestung (a hell, b mittel, c dunkel), t/u = Wappenrock,
     r = Helmbusch. */
  var ritterCache = {};
  function ritterFuer(schluessel, f) {
    if (ritterCache[schluessel]) return ritterCache[schluessel];
    var pal = {
      o: KP.o, a: f.a, b: f.b, c: f.c, t: f.t, u: f.u,
      s: f.s || KP.s, r: f.r, k: KP.k, n: KP.n
    };
    var side = [sprite(knightSide, pal), sprite(knightSide2, pal)];
    ritterCache[schluessel] = {
      down: [sprite(knightDown, pal), sprite(knightDown2, pal)],
      up: [sprite(knightUp, pal), sprite(knightUp2, pal)],
      right: side,
      left: [flipX(side[0]), flipX(side[1])]
    };
    return ritterCache[schluessel];
  }

  /* Schilde der Freunde */
  function makeSchild(farbe, rand) {
    var c = mk(9, 11), g = c.getContext('2d');
    g.fillStyle = rand; g.fillRect(0, 0, 9, 9);
    g.fillRect(1, 9, 7, 1); g.fillRect(3, 10, 3, 1);
    g.fillStyle = farbe; g.fillRect(1, 1, 7, 8); g.fillRect(2, 9, 5, 1);
    g.fillStyle = rand; g.fillRect(4, 2, 1, 6); g.fillRect(2, 4, 5, 1);
    return c;
  }

  function swordFor(stufe) {
    stufe = Math.max(0, Math.min(KLINGEN.length - 1, stufe || 0));
    if (swordCache[stufe]) return swordCache[stufe];
    var k = KLINGEN[stufe];
    swordCache[stufe] = sprite([
      '..w..', '..w..', '.www.', '.wgw.', '.wgw.', '.wgw.', '.wgw.',
      '.wgw.', '.wgw.', 'hhhhh', '..n..', '..n..', '..n..', '..h..'
    ], { w: k.w, g: k.g, h: '#d8a43a', n: '#6b4a2b' });
    return swordCache[stufe];
  }

  /* =========================================================
     KACHELN (16x16) – Wald, Haus, Stadt
     ========================================================= */
  var T = 16;
  function tileCanvas() { return mk(T, T); }

  function grassTile(seed, tuft, flower) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#4b8f46'; g.fillRect(0, 0, T, T);
    var i;
    for (i = 0; i < 26; i++) g.fillStyle = '#437f3f', g.fillRect((r() * T) | 0, (r() * T) | 0, 1, 1);
    for (i = 0; i < 10; i++) g.fillStyle = '#57a24f', g.fillRect((r() * T) | 0, (r() * T) | 0, 1, 2);
    if (tuft) {
      for (i = 0; i < 5; i++) {
        var x = 3 + ((r() * 10) | 0), y = 4 + ((r() * 9) | 0);
        g.fillStyle = '#2f6b34'; g.fillRect(x, y, 1, 3);
        g.fillStyle = '#63b158'; g.fillRect(x + 1, y + 1, 1, 2);
      }
    }
    if (flower) {
      var fc = ['#f0d24a', '#e8718a', '#e8e2f0'];
      for (i = 0; i < 4; i++) {
        var fx = 2 + ((r() * 12) | 0), fy = 2 + ((r() * 12) | 0);
        g.fillStyle = fc[(r() * 3) | 0];
        g.fillRect(fx, fy, 2, 2);
        g.fillStyle = '#2f6b34'; g.fillRect(fx, fy + 2, 1, 2);
      }
    }
    return c;
  }
  function pathTile(seed) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#b08a58'; g.fillRect(0, 0, T, T);
    for (var i = 0; i < 30; i++) {
      g.fillStyle = r() > 0.5 ? '#9c7647' : '#c6a06a';
      g.fillRect((r() * T) | 0, (r() * T) | 0, 1 + ((r() * 2) | 0), 1);
    }
    for (i = 0; i < 3; i++) {
      g.fillStyle = '#8a6840';
      g.fillRect((r() * 13) | 0, (r() * 13) | 0, 2, 2);
    }
    return c;
  }
  function waterTile(seed) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);

  function plankTile(base, dark, light, vertical) {
    var c = tileCanvas(), g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, T, T);
    for (var i = 0; i < T; i += 4) {
      g.fillStyle = dark;
      if (vertical) g.fillRect(i, 0, 1, T); else g.fillRect(0, i, T, 1);
      g.fillStyle = light;
      if (vertical) g.fillRect(i + 1, 0, 1, T); else g.fillRect(0, i + 1, T, 1);
    }
    g.fillStyle = dark;
    if (vertical) g.fillRect(0, 7, T, 1); else g.fillRect(7, 0, 1, T);
    return c;
  }
  function roofTile() {
    var c = tileCanvas(), g = c.getContext('2d');

  /* ---------- Farben fuer die Karte ----------

  var KARTENFARBEN = {
    '.': '#3d6b38', ',': '#446f3c', 'f': '#4a7a40', 'x': '#3d6b38',
    'T': '#1e3a1c', 't': '#1b3320', '*': '#2f5a2c', 'r': '#6b6b74',

  function karteFarbe(ch) { return KARTENFARBEN[ch] || '#2a2633'; }

  /* Macht aus den Kachelzeilen einer Karte ein winziges Bild:

<script>
/* maps.js – die drei Welten: Wald, Holzhaus, Stadt */
(function (global) {
  'use strict';

  function rng(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* Feste Buchstaben, die man nicht betreten kann */
  var SOLID = 'Tt*rs~#^W=bnmhFBCVKOQlP';

  function grid(w, h, ch) {
    var g = [];
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) row.push(ch);
      g.push(row);
    }
    return g;
  }
  function stamp(g, x0, y0, rows) {
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        var ch = rows[y][x];
        if (ch === '|') continue;            /* '|' = nichts verändern */
        if (g[y0 + y] && g[y0 + y][x0 + x] !== undefined) g[y0 + y][x0 + x] = ch;
      }
    }
  }
  function rect(g, x0, y0, w, h, ch) {
    for (var y = y0; y < y0 + h; y++) {
      for (var x = x0; x < x0 + w; x++) {
        if (g[y] && g[y][x] !== undefined) g[y][x] = ch;
      }
    }
  }
  function toStrings(g) {
    var out = [];
    for (var y = 0; y < g.length; y++) out.push(g[y].join(''));
    return out;
  }

  /* ============================ WALD ============================
     Der Wald ist jetzt doppelt so gross: Lichtung mit Haus, Teich,
     Friedhof, eine alte Ruine und ganz oben rechts das Dickicht,
     in dem es richtig ungemuetlich wird. */
  function buildWald() {
    var W = 64, H = 48, r = rng(20250914);
    var g = grid(W, H, '.');
    var x, y, i, k;

    /* Grasvarianten */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var v = r();
        g[y][x] = v > 0.9 ? 'f' : (v > 0.68 ? ',' : '.');
      }
    }
    /* Waldrand ringsum */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var d = Math.min(x, y, W - 1 - x, H - 1 - y);
        if (d === 0 || (d <= 2 && r() > 0.25)) g[y][x] = 'T';
      }
    }
    /* Baumgruppen im Inneren */
    for (i = 0; i < 80; i++) {
      var cx = 4 + ((r() * (W - 8)) | 0), cy = 4 + ((r() * (H - 8)) | 0);
      var n = 1 + ((r() * 4) | 0);
      for (k = 0; k < n; k++) {
        var tx = cx + ((r() * 4) | 0) - 2, ty = cy + ((r() * 4) | 0) - 2;
        if (g[ty] && g[ty][tx]) g[ty][tx] = r() > 0.65 ? 't' : 'T';
      }
    }
    /* Das Dickicht oben rechts: dichte Tannen, kaum Platz */
    for (y = 3; y < 17; y++) {
      for (x = 40; x < W - 3; x++) {
        if (r() > 0.55) g[y][x] = 't';
        else if (r() > 0.85) g[y][x] = 'r';
      }
    }
    /* eine Schneise mitten durchs Dickicht */
    for (x = 40; x < W - 4; x++) { g[10][x] = ','; g[11][x] = ','; }

    /* Büsche, Steine */
    for (i = 0; i < 48; i++) {
      x = 3 + ((r() * (W - 6)) | 0); y = 3 + ((r() * (H - 6)) | 0);
      g[y][x] = r() > 0.45 ? '*' : 'r';
    }

    /* Grosser See unten rechts */
    for (y = 32; y < 45; y++) {
      for (x = 40; x < 60; x++) {
        var dx = (x - 50) / 9.5, dy = (y - 38.5) / 6;
        if (dx * dx + dy * dy < 1) g[y][x] = '~';
      }
    }
    /* Ufersteine */
    for (i = 0; i < 14; i++) {
      x = 40 + ((r() * 20) | 0); y = 31 + ((r() * 14) | 0);
      if (g[y] && g[y][x] === '.') g[y][x] = 'r';
    }

    /* Lichtung ums Haus frei räumen */
    rect(g, 3, 2, 20, 14, '.');
    for (y = 2; y < 16; y++) for (x = 3; x < 23; x++) if (r() > 0.75) g[y][x] = ',';

    /* Holzhaus (8 breit) bei x=6, y=3 */
    stamp(g, 6, 3, [
      '..^^^^^^^^..',
      '.^^^^^^^^^^.',
      '.^^^^^^^^^^.',
      '..#W####W#..',
      '..###Dd###..',
      '..--------..'
    ]);

    /* Wege: vom Haus runter, dann quer nach rechts zum Auto */
    for (y = 9; y <= 19; y++) { g[y][11] = '-'; g[y][12] = '-'; }
    for (x = 11; x <= 31; x++) { g[19][x] = '-'; g[20][x] = '-'; }
    for (y = 19; y <= 26; y++) { g[y][30] = '-'; g[y][31] = '-'; }
    /* Weg weiter nach Osten zum See und nach Norden ins Dickicht */
    for (x = 31; x <= 47; x++) { g[26][x] = '-'; g[27][x] = '-'; }
    for (y = 11; y <= 19; y++) { g[y][41] = '-'; g[y][42] = '-'; }
    /* Platz fürs Auto frei halten */
    rect(g, 24, 15, 6, 4, '-');

    /* Grosse Lichtung in der Mitte (Kampfplatz) */
    rect(g, 14, 24, 16, 11, ',');
    for (y = 24; y < 35; y++) for (x = 14; x < 30; x++) if (r() > 0.82) g[y][x] = 'f';
    g[27][17] = 'T'; g[32][26] = 't'; g[29][22] = '*';

    /* --- Die alte Ruine links unten --- */
    stamp(g, 4, 36, [
      '==..===',
      '=.....=',
      '=.....|',
      '==...==',
      '=..=.=='
    ]);
    for (y = 35; y < 43; y++) for (x = 3; x < 12; x++) if (g[y][x] === '.') g[y][x] = ',';
    for (x = 11; x <= 17; x++) { g[38][x] = '-'; }

    /* --- Der alte Friedhof unten in der Mitte --- */
    rect(g, 16, 38, 10, 8, ',');
    for (y = 38; y < 46; y++) for (x = 16; x < 26; x++) if (r() > 0.7) g[y][x] = '.';
    for (y = 34; y <= 38; y++) { g[y][20] = '-'; g[y][21] = '-'; }

    return {
      key: 'wald',
      name: 'Eichenwald',
      rows: toStrings(g),
      music: 'wald',
      spawn: { x: 11.5, y: 10 },
      zombies: true,
      triggers: [
        { x: 11, y: 7, w: 2, h: 1, kind: 'door', to: 'haus', tx: 10.5, ty: 10.5 }
      ],
      props: [
        { kind: 'car', x: 16.8, y: 10.4 },
        { kind: 'sign', x: 32.5, y: 22.9, text: 'Wegweiser: Nach Osten geht es zur Stadt Eichenstadt. Zu Fuss viel zu weit - nimm das Auto!' },
        /* Lagerfeuer vor dem Haus */
        { kind: 'fire', x: 13.5, y: 14.5 },
        { kind: 'barrel', x: 9.6, y: 9.4 },
        { kind: 'barrel', x: 9.6, y: 10.6 },
        { kind: 'fence', x: 8.5, y: 13.5 },
        { kind: 'fence', x: 9.5, y: 13.5 },
        { kind: 'fence', x: 10.5, y: 13.5 },
        /* Der Friedhof */
        { kind: 'grave', x: 17.5, y: 39.5, art: 0 },
        { kind: 'grave', x: 19.5, y: 39.5, art: 1 },
        { kind: 'grave', x: 21.5, y: 39.5, art: 2 },
        { kind: 'grave', x: 23.5, y: 39.5, art: 1 },
        { kind: 'grave', x: 17.5, y: 42.5, art: 1 },
        { kind: 'grave', x: 19.5, y: 42.5, art: 2 },
        { kind: 'grave', x: 21.5, y: 42.5, art: 0 },
        { kind: 'grave', x: 23.5, y: 42.5, art: 2 },
        { kind: 'grave', x: 18.5, y: 45.2, art: 2 },
        { kind: 'grave', x: 22.5, y: 45.2, art: 1 },
        { kind: 'sign', x: 20.6, y: 36.4, text: 'Verwitterte Tafel: HIER RUHT NIEMAND MEHR RICHTIG. Nachts wird es hier ungemuetlich.' },
        /* Die Ruine */
        { kind: 'fire', x: 6.5, y: 39.5 },
        { kind: 'barrel', x: 8.5, y: 40.5 },
        { kind: 'sign', x: 11.5, y: 37.4, text: 'Halb zerfallene Tafel: ...RITTERBURG... hier stand mal etwas Grosses.' },
        /* Das Dickicht */
        { kind: 'sign', x: 40.5, y: 12.4, text: 'Grob geschnitzt: DICKICHT. WER NACHTS REINGEHT, KOMMT NICHT RAUS.' },
        { kind: 'rock', x: 45.5, y: 14.5 },
        { kind: 'rock', x: 52.5, y: 9.5 },
        /* Am See */
        { kind: 'bench', x: 45.5, y: 31.5 },
        { kind: 'fire', x: 43.5, y: 30.5 }
      ],
      /* Startplätze für die vier Freunde vor dem Haus */
      friendSpots: [
        { x: 15.5, y: 11 }, { x: 17, y: 12.5 }, { x: 14, y: 13 }, { x: 16.5, y: 14.5 }
      ]
    };
  }

  /* ============================ HAUS ============================ */
  function buildHaus() {
    var rows = [
      '====================',
      '==W=======W======W==',

      '=___mmm___________h=',
      '=___mmm____________=',
      '=___hhh____________=',

      '=__________________=',

      ],

  /* ============================ STADT ============================ */
  function buildStadt() {
    var W = 44, H = 30, r = rng(31415);
    var g = grid(W, H, 'S');
    var x, y, i;

    /* Alles Gehweg, dann Straßen einzeichnen */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        /* Waagerechte Hauptstraße */
        if (y >= 13 && y <= 17) g[y][x] = (y === 15 ? 'M' : 'R');
        /* Senkrechte Straße */
        if (x >= 20 && x <= 24) g[y][x] = (x === 22 && !(y >= 13 && y <= 17) ? 'M' : 'R');
      }
    }
    /* Häuserblöcke */
    function block(x0, y0, w, h, kinds) {
      for (var yy = y0; yy < y0 + h; yy++) {
        for (var xx = x0; xx < x0 + w; xx++) {
          if (!g[yy] || g[yy][xx] === undefined) continue;
          var bi = Math.floor((xx - x0) / 4) + Math.floor((yy - y0) / 3) * 2;
          g[yy][xx] = kinds[bi % kinds.length];
        }
      }
    }
    block(2, 2, 14, 8, ['B', 'B', 'C', 'V']);
    block(27, 2, 14, 8, ['V', 'C', 'B', 'B']);
    block(2, 21, 13, 7, ['C', 'B', 'V', 'C']);
    block(28, 21, 13, 7, ['B', 'V', 'C', 'B']);
    /* Ladenzeile an der Hauptstraße */
    for (x = 4; x < 14; x++) g[10][x] = 'K';
    for (x = 29; x < 39; x++) g[10][x] = 'K';
    for (x = 5; x < 13; x++) g[20][x] = 'K';
    /* Park mit Brunnen in der Mitte unten */
    rect(g, 16, 19, 8, 8, 'S');

<script>
/* dialog.js – Textbox im Undertale-Stil: Buchstaben tippen sich einzeln,
   und man kann Antworten auswählen. */
(function (global) {
  'use strict';

  var box, whoEl, txtEl, optsEl, moreEl;

  var D = {
    queue: [],
    node: null,
    full: '',
    shown: 0,
    t: 0,
    speed: 42,          /* Buchstaben pro Sekunde */
    sel: 0,
    open: false,
    onFinish: null
  };

  function el(id) { return document.getElementById(id); }

  D.init = function () {
    box = el('box'); whoEl = el('who'); txtEl = el('txt');
    optsEl = el('opts'); moreEl = el('more');
    box.addEventListener('click', function (e) {
      if (e.target && e.target.classList.contains('opt')) return;
      D.press();
    });
  };

  /* text: String. who: Name. color: Farbe des Namens. opts: [{t:'Antwort', r:'Reaktion'}] */
  D.push = function (who, color, text, opts) {
    D.queue.push({ who: who, color: color || '#ffd24a', text: text, opts: opts || null });
  };
  D.say = function (who, color, text) { D.push(who, color, text); D.begin(); };

  D.begin = function (onFinish) {
    if (onFinish) D.onFinish = onFinish;
    if (!D.node) next();
  };

  function next() {
    if (!D.queue.length) {
      D.open = false;
      box.classList.remove('on');
      D.node = null;
      var f = D.onFinish; D.onFinish = null;
      if (f) f();
      return;
    }
    D.node = D.queue.shift();
    D.full = D.node.text;
    D.shown = 0; D.t = 0; D.sel = 0;
    D.open = true;
    box.classList.add('on');
    whoEl.textContent = D.node.who || '';
    whoEl.style.color = D.node.color || '#ffd24a';
    txtEl.textContent = '';
    optsEl.innerHTML = '';
    moreEl.classList.remove('on');
  }

  function showOptions() {
    optsEl.innerHTML = '';
    if (!D.node.opts) { moreEl.classList.add('on'); return; }
    for (var i = 0; i < D.node.opts.length; i++) {
      (function (i) {
        var d = document.createElement('div');
        d.className = 'opt' + (i === D.sel ? ' sel' : '');
        d.textContent = D.node.opts[i].t;
        d.addEventListener('click', function (ev) {
          ev.stopPropagation();
          D.sel = i; choose();
        });
        optsEl.appendChild(d);
      })(i);
    }
  }

  function markSel() {
    var kids = optsEl.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].className = 'opt' + (i === D.sel ? ' sel' : '');
    }
  }

  function choose() {
    var o = D.node.opts[D.sel];
    if (global.Audio8) Audio8.select();
    var node = D.node;
    D.node = null;
    optsEl.innerHTML = '';
    if (o.r) {
      D.queue.unshift({ who: node.who, color: node.color, text: o.r, opts: null });
    }
    if (o.go) o.go();
    next();
  }

  D.update = function (dt) {
    if (!D.node) return;
    if (D.shown < D.full.length) {
      D.t += dt * D.speed;
      while (D.t >= 1 && D.shown < D.full.length) {
        D.t -= 1; D.shown++;
        var c = D.full[D.shown - 1];
        if (c !== ' ' && global.Audio8 && D.shown % 2 === 0) Audio8.blip();
      }
      txtEl.textContent = D.full.slice(0, D.shown);
      if (D.shown >= D.full.length) showOptions();
    }
  };

  /* Bestätigen / weiter */
  D.press = function () {
    if (!D.node) return;
    if (D.shown < D.full.length) {          /* erst Text komplett zeigen */
      D.shown = D.full.length;
      txtEl.textContent = D.full;
      showOptions();
      return;
    }
    if (D.node.opts) { choose(); return; }
    D.node = null;
    next();
  };

  D.move = function (dir) {
    if (!D.node || !D.node.opts || D.shown < D.full.length) return;
    D.sel = (D.sel + dir + D.node.opts.length) % D.node.opts.length;
    if (global.Audio8) Audio8.blip();
    markSel();
  };

  D.isOpen = function () { return D.open; };
  D.clear = function () { D.queue.length = 0; D.node = null; D.open = false; if (box) box.classList.remove('on'); };

  global.Dialog = D;
})(window);

</script>

(function (global) {

    var k = KEYMAP[e.key];
    if (!k) return;

    if (!keys[k]) tapped[k] = true;

  /* ================= Laufen =================

  var stick = null;

  function bindStick() {
    if (!global.Joystick) return;
    stick = new Joystick({
      radius: 60,
      deadZone: 0.18,

      /* Gelaufen (und im Kampf ausgewichen) wird, sobald das Spiel laeuft. */
      canStart: function () {
        return G.state === 'play' || G.state === 'over';
      },

      /* Knoepfe und die Textbox behalten ihre eigenen Beruehrungen. */
      ignore: function (target) {
        if (!target || !target.closest) return false;
        return !!(target.closest('button') || target.closest('#box'));
      },

      /* Kurz getippt statt gezogen: Spiel starten oder weiterlesen. */
      onTap: function (x, y) {
        if (A) A.resume();
        if (G.state === 'title') { startGame(); return; }
        if (G.karteOffen) { G.karteOffen = false; return; }

        if (G.state === 'drive') { tapped.talk = true; }
      }
    });
  }

  /* Richtung, in die der Ritter laufen soll: erst der Stick, sonst Tasten. */
  function laufRichtung() {
    var dx = 0, dy = 0;
    if (stick && stick.active && (stick.x !== 0 || stick.y !== 0)) {
      dx = stick.x;
      dy = stick.y;
    } else {
      if (keys.left) dx -= 1;
      if (keys.right) dx += 1;
      if (keys.up) dy -= 1;
      if (keys.down) dy += 1;
    }
    var laenge = Math.sqrt(dx * dx + dy * dy);
    if (laenge > 1) { dx /= laenge; dy /= laenge; }   /* nie schneller als 1 */
    return { x: dx, y: dy };
  }

        b.addEventListener('touchstart', on, { passive: false });
        b.addEventListener('touchend', off, { passive: false });

        b.addEventListener('mouseup', off);

  }

  function solidTile(ch) { return MAPS.SOLID.indexOf(ch) >= 0; }

  }

  function loadMap(key, tx, ty, after) {
    var m = MAPS[key]();
    G.map = m; G.mapKey = key;
    G.mapH = m.rows.length; G.mapW = m.rows[0].length;
    karteBild = S.karteBauen(m.rows);      /* kleines Bild der ganzen Karte */

    if (Fx) Fx.leeren();

    G.boss = null;
    G.blocks = [];

    for (var y = 0; y < G.mapH; y++) {
      for (var x = 0; x < G.mapW; x++) {
        var ch = m.rows[y][x];
        if (ch === 'T') addProp('tree', x + 0.5, y + 1);
        else if (ch === 't') addProp('pine', x + 0.5, y + 1);
        else if (ch === '*') addProp('bush', x + 0.5, y + 1);

    }

    for (var i = 0; i < m.props.length; i++) {
