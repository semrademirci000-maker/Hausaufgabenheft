<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0a10">
<title>Oakblade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: #07060c;
  color: #fff;
  font-family: "Courier New", ui-monospace, monospace;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#wrap {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative;
  width: 320px; height: 240px;
  transform-origin: center center;
}

#game {
  display: block;
  width: 320px; height: 240px;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#ui { position: absolute; inset: 0; pointer-events: none; }

/* ---------- Textbox im Undertale-Stil ---------- */
#box {
  position: absolute;
  left: 6px; right: 6px; bottom: 6px;
  min-height: 62px;
  background: #000;
  border: 3px solid #fff;
  padding: 5px 7px 6px;
  display: none;
  pointer-events: auto;
}
#box.on { display: block; }

#who {
  font-size: 8px; letter-spacing: 1px;
  color: #ffd24a; margin-bottom: 3px;
  text-transform: uppercase;
}
#txt {
  font-size: 10px; line-height: 13px;
  color: #fff; white-space: pre-wrap; word-break: break-word;
  min-height: 26px;
}
#opts { margin-top: 3px; }
.opt {
  position: relative;
  font-size: 10px; line-height: 13px;
  padding-left: 11px; color: #dcdcdc; cursor: pointer;
}
.opt.sel { color: #fff; }
.opt.sel::before {
  content: "♥"; position: absolute; left: 0; top: 0; color: #ff5a5a;
}
#more {
  position: absolute; right: 6px; bottom: 2px;
  font-size: 9px; color: #fff; display: none;
}
#more.on { display: block; animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- Knöpfe ---------- */
#sound {
  position: fixed; top: 8px; right: 8px;
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid #4a4560; background: #14121c; color: #ffd24a;
  font-size: 15px; line-height: 1; cursor: pointer; z-index: 5;
}
#sound.off { color: #5a5670; }

/* ---------- Steuerkreuz und Knöpfe: immer da ---------- */
#touch {
  display: block;
  position: fixed; inset: auto 0 0 0; height: 160px;
  z-index: 4; pointer-events: none;
}
/* Beim Reden und auf dem Titelbild stören die Knöpfe nur */
#touch.off { display: none; }
#abtn {
  position: absolute; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; align-items: flex-end; pointer-events: auto;
}
.act {
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(30,28,44,.82); border: 2px solid #4a4560;
  color: #cfc9e6; font-size: 17px; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.act.big { width: 74px; height: 74px; border-color: #b8453f; color: #ff9a8a; font-size: 22px; }
.act.auto { border-color: #e8a54a; color: #ffd24a; }
.act small { font-size: 7px; opacity: .75; margin-top: 2px; }
.act:active { background: #3b3660; }

/* Mit Maus und Tastatur halten sich die Knöpfe zurück */
@media (pointer: fine) {
  #abtn { opacity: .55; transition: opacity .2s; }
  #abtn:hover { opacity: 1; }
}

</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="240"></canvas>

    <div id="ui">
      <!-- Undertale-artige Textbox -->
      <div id="box">
        <div id="who"></div>
        <div id="txt"></div>
        <div id="opts"></div>
        <div id="more">▼</div>
      </div>
    </div>
  </div>
</div>

<button id="sound" title="Musik an/aus">♪</button>

<div id="touch">
  <div id="abtn">
    <button class="act auto" data-k="auto">&#128663;<small id="autotext">Stadt</small></button>
    <button class="act" data-k="talk">E<small>reden</small></button>
    <button class="act big" data-k="attack">⚔<small>schlagen</small></button>
  </div>
</div>

<script>
/* joystick.js – Virtueller Joystick im Brawl-Stars-Stil.

   Finger irgendwo aufsetzen: der Stick erscheint genau dort und folgt dem
   Daumen. Loslassen blendet ihn wieder aus.

   Wichtig: Es wird sowohl auf Finger- (touch) als auch auf Maus-Ereignisse
   gehorcht. Nur auf "pointer"-Ereignisse zu bauen hat sich als unzuverlässig
   erwiesen – in manchen Umgebungen kommen sie nicht an.

   Ein kurzes Tippen ohne Ziehen ist kein Laufen, sondern ein Tipp: dafür
   gibt es `onTap` (das Spiel liest damit Texte weiter).
*/
(function (global) {
  'use strict';

  class Joystick {

    constructor(options) {
      var o = options || {};
      this.radius = o.radius || 60;
      this.deadZone = o.deadZone != null ? o.deadZone : 0.18;
      this.canStart = o.canStart || function () { return true; };
      this.ignore = o.ignore || function () { return false; };
      this.onTap = o.onTap || null;

      this.x = 0;              // -1 .. 1  (links/rechts)
      this.y = 0;              // -1 .. 1  (oben/unten, + = runter)
      this.active = false;     // Finger liegt auf und der Stick ist sichtbar
      this.used = false;       // schon einmal benutzt (für den Hinweis)

      this._touchId = null;    // welcher Finger zieht gerade
      this._lastTouch = 0;     // wann zuletzt ein Finger/Pointer kam
      this.visible = false;    // wird vom Spiel ein- und ausgeschaltet
      this._down = false;      // Finger liegt auf (auch wenn kein Stick)
      this._origin = { x: 0, y: 0 };
      this._moved = 0;
      this._start = 0;

      var zone = o.zone || document.body;

      this.base = document.createElement('div');
      this.base.style.cssText =
        'position:fixed;width:' + (this.radius * 2) + 'px;height:' + (this.radius * 2) + 'px;' +
        'border-radius:50%;background:rgba(30,28,44,.55);' +
        'border:3px solid rgba(207,201,230,.75);pointer-events:none;' +
        'display:none;z-index:9999;transform:translate(-50%,-50%);';

      this.knob = document.createElement('div');
      this.knob.style.cssText =
        'position:fixed;width:' + this.radius + 'px;height:' + this.radius + 'px;' +
        'border-radius:50%;background:rgba(150,142,205,.9);' +
        'border:3px solid rgba(255,255,255,.85);pointer-events:none;' +
        'display:none;z-index:10000;transform:translate(-50%,-50%);';

      document.body.appendChild(this.base);
      document.body.appendChild(this.knob);

      zone.style.touchAction = 'none';
      document.documentElement.style.touchAction = 'none';

      var self = this;
      global.addEventListener('resize', function () {
        if (!self._down) self._zeigeRuheplatz();
      });

      this._listen(zone);
    }

    /* ---- Ereignisse ----------------------------------------------------
       Es wird auf ALLE Arten gehorcht: pointer, touch und Maus. Welche ein
       Geraet schickt, ist von Browser zu Browser verschieden - und manche
       schicken die eine zum Anfassen und die andere zum Ziehen. Deshalb
       darf jede Art jede laufende Beruehrung fortsetzen; doppelte Meldungen
       schreiben einfach denselben Wert und stoeren nicht.
       Nur echte Maus-Echos nach einer Fingerberuehrung werden verworfen. */
    _listen(zone) {
      var self = this;

      function istEcho(art) {
        return art === 'maus' && (Date.now() - self._lastTouch) < 900;
      }
      function merken(art) {
        if (art !== 'maus') self._lastTouch = Date.now();
      }

      /* 1) Pointer */
      if (global.PointerEvent) {
        zone.addEventListener('pointerdown', function (e) {
          merken('pointer');
          self._begin(e, e, null);
        });
        global.addEventListener('pointermove', function (e) {
          merken('pointer');
          self._drag(e);
        });
        global.addEventListener('pointerup', function () { merken('pointer'); self._stop(); });
        global.addEventListener('pointercancel', function () { merken('pointer'); self._stop(); });
      }

      /* 2) Finger */
      zone.addEventListener('touchstart', function (e) {
        var t = e.changedTouches[0];
        if (!t) return;
        merken('touch');
        self._begin(t, e, t.identifier);
      }, { passive: false });

      global.addEventListener('touchmove', function (e) {
        merken('touch');
        var t = self._passenderFinger(e.changedTouches);
        if (!t) return;
        self._drag(t);
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      var fingerWeg = function (e) {
        merken('touch');
        if (self._touchId === null || self._passenderFinger(e.changedTouches)) self._stop();
      };
      global.addEventListener('touchend', fingerWeg);
      global.addEventListener('touchcancel', fingerWeg);

      /* 3) Maus */
      zone.addEventListener('mousedown', function (e) {
        if (istEcho('maus')) return;
        self._begin(e, e, null);
      });
      global.addEventListener('mousemove', function (e) {
        if (istEcho('maus')) return;
        self._drag(e);
      });
      global.addEventListener('mouseup', function () {
        if (istEcho('maus')) return;
        self._stop();
      });

      global.addEventListener('blur', function () { self.release(); });
    }

    /* Der Stick sitzt in Ruhe unten links - damit man ihn sieht. */
    _ruheplatz() {
      return { x: 30 + this.radius, y: global.innerHeight - 30 - this.radius };
    }

    _zeigeRuheplatz() {
      if (!this.visible) return;
      var platz = this._ruheplatz();
      this.base.style.left = this.knob.style.left = platz.x + 'px';
      this.base.style.top = this.knob.style.top = platz.y + 'px';
      this.base.style.display = this.knob.style.display = 'block';
      this.base.style.opacity = this.knob.style.opacity = '0.45';
    }

    /* Das Spiel sagt, wann gelaufen werden darf. */
    setVisible(sichtbar) {
      if (sichtbar === this.visible) return;
      this.visible = sichtbar;
      if (!sichtbar) {
        this.release();
        this.base.style.display = this.knob.style.display = 'none';
      } else {
        this._zeigeRuheplatz();
      }
    }

    /* Der Finger, der den Stick angefasst hat (falls bekannt). */
    _passenderFinger(liste) {
      if (this._touchId === null) return liste[0] || null;
      for (var i = 0; i < liste.length; i++) {
        if (liste[i].identifier === this._touchId) return liste[i];
      }
      return null;
    }

    _begin(point, event, touchId) {
      if (this._down) return;
      if (this.ignore(point.target)) return;        // Knöpfe haben Vorrang

      this._down = true;
      this._touchId = (touchId === undefined) ? null : touchId;
      this._origin = { x: point.clientX, y: point.clientY };
      this._moved = 0;
      this._start = Date.now();

      if (this.canStart()) {
        this.active = true;
        this.used = true;
        this.base.style.left = this.knob.style.left = point.clientX + 'px';
        this.base.style.top = this.knob.style.top = point.clientY + 'px';
        this.base.style.display = this.knob.style.display = 'block';
        this.base.style.opacity = this.knob.style.opacity = '1';
      }
      if (event && event.cancelable) event.preventDefault();
    }

    _drag(point) {
      if (!this._down) return;

      var dx = point.clientX - this._origin.x;
      var dy = point.clientY - this._origin.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > this._moved) this._moved = dist;
      if (!this.active) return;

      if (dist > this.radius) {
        dx = dx / dist * this.radius;
        dy = dy / dist * this.radius;
      }
      this.knob.style.left = (this._origin.x + dx) + 'px';
      this.knob.style.top = (this._origin.y + dy) + 'px';

      var nx = dx / this.radius, ny = dy / this.radius;
      if (Math.sqrt(nx * nx + ny * ny) < this.deadZone) { this.x = 0; this.y = 0; }
      else { this.x = nx; this.y = ny; }
    }

    _stop() {
      if (!this._down) return;
      var kurz = this._moved < 14 && (Date.now() - this._start) < 600;
      this.release();
      if (kurz && this.onTap) this.onTap();          // getippt statt gezogen
    }

    /* Alles loslassen – auch von aussen aufrufbar. */
    release() {
      this._down = false;
      this.active = false;
      this._touchId = null;
      this.x = this.y = 0;
      if (this.visible) this._zeigeRuheplatz();
      else this.base.style.display = this.knob.style.display = 'none';
    }

    get angle() { return Math.atan2(this.y, this.x); }
    get distance() { return Math.min(1, Math.sqrt(this.x * this.x + this.y * this.y)); }
  }

  global.Joystick = Joystick;
})(window);

</script>

   Kein einziges Bild wird geladen: alles ist Pixel für Pixel im Code. */
(function (global) {
  'use strict';

  var warnings = [];

  function mk(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    return c;
  }

  /* Baut ein Sprite aus Textzeilen. '.' = durchsichtig. */
  function sprite(rows, pal) {
    var w = 0, y, x;
    for (y = 0; y < rows.length; y++) w = Math.max(w, rows[y].length);
    var c = mk(w, rows.length), g = c.getContext('2d');
    for (y = 0; y < rows.length; y++) {
      if (rows[y].length !== w && rows[y].length !== 0) {
        warnings.push('Zeile ' + y + ': ' + rows[y].length + ' statt ' + w + ' Pixel');
      }
      for (x = 0; x < rows[y].length; x++) {
        var ch = rows[y][x];
        if (ch === '.' || ch === ' ') continue;
        var col = pal[ch];
        if (!col) { warnings.push('Farbe "' + ch + '" fehlt'); continue; }
        g.fillStyle = col;
        g.fillRect(x, y, 1, 1);
      }
    }
    return c;
  }

  function flipX(src) {
    var c = mk(src.width, src.height), g = c.getContext('2d');
    g.translate(src.width, 0); g.scale(-1, 1);
    g.drawImage(src, 0, 0);
    return c;
  }

  /* kleiner, immer gleicher Zufall – damit Gras jedes Mal gleich aussieht */
  function rng(seed) {
    var s = seed >>> 0;

      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* Waldspinne: dicker Leib, acht Beine, rote Augen */
  function makeSpider(step) {
    var c = mk(30, 22), g = c.getContext('2d');
    var beinFarbe = '#241a2e', hoch = step ? 1 : 0;
    var beine = [
      [11, 12, 2, 6], [11, 13, 5, 9], [19, 12, 28, 6], [19, 13, 25, 9]
    ];
    for (var i = 0; i < beine.length; i++) {
      var b = beine[i];
      var x0 = b[0], y0 = b[1] + (i % 2 ? hoch : -hoch);
      var x1 = b[2], y1 = b[3] + (i % 2 ? -hoch : hoch);
      // grobe Pixel-Linie
      var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (var t = 0; t <= n; t++) {
        var x = Math.round(x0 + (x1 - x0) * t / n);
        var y = Math.round(y0 + (y1 - y0) * t / n);
        g.fillStyle = beinFarbe;
        g.fillRect(x, y, 2, 2);
      }
    }
    blob(g, 15, 14, 7, '#2e2140');
    blob(g, 15, 13, 6, '#3f2c57');
    blob(g, 15, 8, 5, '#241a2e');
    blob(g, 15, 7, 4, '#4a3568');
    g.fillStyle = '#d24b4b';
    g.fillRect(12, 6, 2, 2); g.fillRect(17, 6, 2, 2);
    g.fillStyle = '#ff9a8a';
    g.fillRect(12, 6, 1, 1); g.fillRect(17, 6, 1, 1);
    g.fillStyle = '#6b4f8a';
    g.fillRect(13, 12, 4, 2); g.fillRect(14, 16, 3, 2);
    return c;
  }

  /* Der Ritter in besserer Ruestung und mit besserem Schwert */
  var RUESTUNGEN = [
    { a: '#d3dbe8', b: '#9aa4b8', c: '#646e82' },   /* Eisen */
    { a: '#e8c48a', b: '#b3853f', c: '#7a5a28' },   /* Bronze */
    { a: '#eaf1fb', b: '#b6c2d6', c: '#7d8a9e' },   /* Silber */
    { a: '#ffe08a', b: '#d8a43a', c: '#96702a' }    /* Gold */
  ];
  var KLINGEN = [
    { w: '#eef3fb', g: '#aab6c8' },
    { w: '#ffffff', g: '#c4cedd' },
    { w: '#dff0ff', g: '#9ec6e8' },
    { w: '#ffe8a0', g: '#d8a43a' }
  ];

  var knightCache = {}, swordCache = {};

  function knightFor(stufe) {
    stufe = Math.max(0, Math.min(RUESTUNGEN.length - 1, stufe || 0));
    if (knightCache[stufe]) return knightCache[stufe];
    var r = RUESTUNGEN[stufe];
    var pal = {
      o: KP.o, a: r.a, b: r.b, c: r.c, t: KP.t, u: KP.u,
      s: KP.s, r: KP.r, k: KP.k, n: KP.n
    };
    var side = [sprite(knightSide, pal), sprite(knightSide2, pal)];
    knightCache[stufe] = {
      down: [sprite(knightDown, pal), sprite(knightDown2, pal)],
      up: [sprite(knightUp, pal), sprite(knightUp2, pal)],
      right: side,
      left: [flipX(side[0]), flipX(side[1])]
    };
    return knightCache[stufe];
  }

  function swordFor(stufe) {
    stufe = Math.max(0, Math.min(KLINGEN.length - 1, stufe || 0));
    if (swordCache[stufe]) return swordCache[stufe];
    var k = KLINGEN[stufe];
    swordCache[stufe] = sprite([
      '..w..', '..w..', '.www.', '.wgw.', '.wgw.', '.wgw.', '.wgw.',
      '.wgw.', '.wgw.', 'hhhhh', '..n..', '..n..', '..n..', '..h..'
    ], { w: k.w, g: k.g, h: '#d8a43a', n: '#6b4a2b' });
    return swordCache[stufe];
  }

  /* =========================================================
     KACHELN (16x16) – Wald, Haus, Stadt
     ========================================================= */
  var T = 16;
  function tileCanvas() { return mk(T, T); }

  function grassTile(seed, tuft, flower) {
    var c = tileCanvas(), g = c.getContext('2d'), r = rng(seed);
    g.fillStyle = '#4b8f46'; g.fillRect(0, 0, T, T);
    var i;
    for (i = 0; i < 26; i++) g.fillStyle = '#437f3f', g.fillRect((r() * T) | 0, (r() * T) | 0, 1, 1);
    for (i = 0; i < 10; i++) g.fillStyle = '#57a24f', g.fillRect((r() * T) | 0, (r() * T) | 0, 1, 2);
    if (tuft) {
      for (i = 0; i < 5; i++) {
        var x = 3 + ((r() * 10) | 0), y = 4 + ((r() * 9) | 0);
        g.fillStyle = '#2f6b34'; g.fillRect(x, y, 1, 3);
        g.fillStyle = '#63b158'; g.fillRect(x + 1, y + 1, 1, 2);
      }
    }
    if (flower) {
      var fc = ['#f0d24a', '#e8718a', '#e8e2f0'];
      for (i = 0; i < 4; i++) {
        var fx = 2 + ((r() * 12) | 0), fy = 2 + ((r() * 12) | 0);
        g.fillStyle = fc[(r() * 3) | 0];
        g.fillRect(fx, fy, 2, 2);
        g.fillStyle = '#2f6b34'; g.fillRect(fx, fy + 2, 1, 2);
      }
    }
    return c;
  }
  function pathTile(seed) {

  function plankTile(base, dark, light, vertical) {
    var c = tileCanvas(), g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, T, T);

      g.fillStyle = dark;
      if (vertical) g.fillRect(i, 0, 1, T); else g.fillRect(0, i, T, 1);
      g.fillStyle = light;
      if (vertical) g.fillRect(i + 1, 0, 1, T); else g.fillRect(0, i + 1, T, 1);
    }
    g.fillStyle = dark;
    if (vertical) g.fillRect(0, 7, T, 1); else g.fillRect(7, 0, 1, T);
    return c;
  }

/* maps.js – die drei Welten: Wald, Holzhaus, Stadt */
(function (global) {
  'use strict';

  function rng(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* Feste Buchstaben, die man nicht betreten kann */
  var SOLID = 'Tt*rs~#^W=bnmhFBCVKOQlP';

  function grid(w, h, ch) {
    var g = [];
    for (var y = 0; y < h; y++) {
      var row = [];
      for (var x = 0; x < w; x++) row.push(ch);
      g.push(row);
    }
    return g;
  }
  function stamp(g, x0, y0, rows) {
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        var ch = rows[y][x];
        if (ch === '|') continue;            /* '|' = nichts verändern */
        if (g[y0 + y] && g[y0 + y][x0 + x] !== undefined) g[y0 + y][x0 + x] = ch;
      }
    }
  }
  function rect(g, x0, y0, w, h, ch) {
    for (var y = y0; y < y0 + h; y++) {
      for (var x = x0; x < x0 + w; x++) {
        if (g[y] && g[y][x] !== undefined) g[y][x] = ch;
      }
    }
  }
  function toStrings(g) {
    var out = [];
    for (var y = 0; y < g.length; y++) out.push(g[y].join(''));
    return out;
  }

  /* ============================ WALD ============================ */
  function buildWald() {
    var W = 44, H = 34, r = rng(20250914);
    var g = grid(W, H, '.');
    var x, y;

    /* Grasvarianten */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var v = r();
        g[y][x] = v > 0.9 ? 'f' : (v > 0.68 ? ',' : '.');
      }
    }
    /* Waldrand ringsum */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var d = Math.min(x, y, W - 1 - x, H - 1 - y);
        if (d === 0 || (d <= 2 && r() > 0.25)) g[y][x] = 'T';
      }
    }
    /* Baumgruppen im Inneren */
    for (var i = 0; i < 34; i++) {
      var cx = 4 + ((r() * (W - 8)) | 0), cy = 4 + ((r() * (H - 8)) | 0);
      var n = 1 + ((r() * 4) | 0);
      for (var k = 0; k < n; k++) {
        var tx = cx + ((r() * 4) | 0) - 2, ty = cy + ((r() * 4) | 0) - 2;
        if (g[ty] && g[ty][tx]) g[ty][tx] = r() > 0.65 ? 't' : 'T';
      }
    }
    /* Büsche, Steine */
    for (i = 0; i < 24; i++) {
      x = 3 + ((r() * (W - 6)) | 0); y = 3 + ((r() * (H - 6)) | 0);
      g[y][x] = r() > 0.45 ? '*' : 'r';
    }
    /* Teich unten rechts */
    for (y = 24; y < 31; y++) {
      for (x = 31; x < 41; x++) {
        var dx = (x - 36) / 5, dy = (y - 27.5) / 3.4;
        if (dx * dx + dy * dy < 1) g[y][x] = '~';
      }
    }

    /* Lichtung ums Haus frei räumen */
    rect(g, 3, 2, 18, 12, '.');
    for (y = 2; y < 14; y++) for (x = 3; x < 21; x++) if (r() > 0.75) g[y][x] = ',';

    /* Holzhaus (8 breit) bei x=6, y=3 */
    stamp(g, 6, 3, [
      '..^^^^^^^^..',
      '.^^^^^^^^^^.',
      '.^^^^^^^^^^.',
      '..#W####W#..',
      '..###Dd###..',
      '..--------..'
    ]);

    /* Weg vom Haus nach unten und nach rechts zum Auto */
    for (y = 9; y <= 17; y++) { g[y][11] = '-'; g[y][12] = '-'; }
    for (x = 11; x <= 27; x++) { g[17][x] = '-'; g[18][x] = '-'; }
    for (y = 17; y <= 22; y++) { g[y][26] = '-'; g[y][27] = '-'; }
    /* Platz fürs Auto frei halten */
    rect(g, 24, 14, 6, 4, '-');

    /* Lichtung in der Mitte (Kampfplatz) */
    rect(g, 14, 21, 12, 8, ',');
    for (y = 21; y < 29; y++) for (x = 14; x < 26; x++) if (r() > 0.82) g[y][x] = 'f';
    /* ein paar einzelne Bäume als Deko in der Lichtung */
    g[23][16] = 'T'; g[27][23] = 't'; g[25][20] = '*';

      friendSpots: [

  }

  /* ============================ HAUS ============================ */
  function buildHaus() {
    var rows = [
      '====================',
      '==W=======W======W==',
      '=F________________b=',
      '=_________________n=',
      '=___mmm___________h=',
      '=___mmm____________=',
      '=___hhh____________=',
      '=b_________cc______=',
      '=n_________cc______=',
      '=h_________________=',
      '=__________________=',
      '=_________Dd_______=',
      '====================',
      '====================',
      '===================='

      name: 'Zuhause',
      rows: rows,

      spawn: { x: 10.5, y: 10.5 },

        { x: 10, y: 11, w: 2, h: 1, kind: 'door', to: 'wald', tx: 11.5, ty: 10 }
      ],

  }

  /* ============================ STADT ============================ */
  function buildStadt() {
    var W = 44, H = 30, r = rng(31415);
    var g = grid(W, H, 'S');
    var x, y, i;

    /* Alles Gehweg, dann Straßen einzeichnen */
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        /* Waagerechte Hauptstraße */
        if (y >= 13 && y <= 17) g[y][x] = (y === 15 ? 'M' : 'R');
        /* Senkrechte Straße */
        if (x >= 20 && x <= 24) g[y][x] = (x === 22 && !(y >= 13 && y <= 17) ? 'M' : 'R');
      }
    }
    /* Häuserblöcke */
    function block(x0, y0, w, h, kinds) {
      for (var yy = y0; yy < y0 + h; yy++) {
        for (var xx = x0; xx < x0 + w; xx++) {
          if (!g[yy] || g[yy][xx] === undefined) continue;
          var bi = Math.floor((xx - x0) / 4) + Math.floor((yy - y0) / 3) * 2;
          g[yy][xx] = kinds[bi % kinds.length];

    block(2, 2, 14, 8, ['B', 'B', 'C', 'V']);
    block(27, 2, 14, 8, ['V', 'C', 'B', 'B']);
    block(2, 21, 13, 7, ['C', 'B', 'V', 'C']);
    block(28, 21, 13, 7, ['B', 'V', 'C', 'B']);
    /* Ladenzeile an der Hauptstraße */
    for (x = 4; x < 14; x++) g[10][x] = 'K';
    for (x = 29; x < 39; x++) g[10][x] = 'K';
    for (x = 5; x < 13; x++) g[20][x] = 'K';
    /* Park mit Brunnen in der Mitte unten */
    rect(g, 16, 19, 8, 8, 'S');
    rect(g, 17, 20, 6, 6, '.');
    for (y = 20; y < 26; y++) for (x = 17; x < 23; x++) if (r() > 0.7) g[y][x] = ',';

    /* Raender: aussen Gebaeude, damit man nicht rauslaeuft */
    for (y = 0; y < H; y++) {
      g[y][0] = 'B'; g[y][1] = 'B'; g[y][W - 1] = 'B'; g[y][W - 2] = 'B';
    }
    for (x = 0; x < W; x++) {
      g[0][x] = 'B'; g[1][x] = 'B'; g[H - 1][x] = 'B'; g[H - 2][x] = 'B';
    }
    /* Strassen bis zum Rand offen lassen (Ein- und Ausfahrt) */
    for (x = 0; x < W; x++) {
      if (x < 2 || x > W - 3) { g[14][x] = 'R'; g[15][x] = 'M'; g[16][x] = 'R'; }
    }

    /* Von oben sieht man Daecher - nur die Seite zur Strasse ist Hauswand */
    function offen(ch) { return 'SRM.,f-'.indexOf(ch) >= 0; }
    var g2 = [];
    for (y = 0; y < H; y++) g2.push(g[y].slice());
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        var ch = g[y][x];
        if ('BCVK'.indexOf(ch) < 0) continue;
        var untenFrei = (y + 1 < H) && offen(g[y + 1][x]);
        if (!untenFrei) g2[y][x] = (ch === 'C' || ch === 'K') ? 'Q' : 'O';
      }
    }
    g = g2;

    var props = [
      { kind: 'sign', x: 18.5, y: 12.6, text: 'Auf dem Blatt am Stadttor steht: "EICHENSTADT - 412 Einwohner, 3 Baecker, 0 Zombies. Bitte Schwert stecken lassen!"' },

      { kind: 'lamp', x: 26.5, y: 11.6 },
      { kind: 'car', x: 26.5, y: 20.5 },
      { kind: 'fountain', x: 19.9, y: 23.5 },
      { kind: 'bench', x: 17.5, y: 25.6 },
      { kind: 'bench', x: 22.3, y: 25.6 },
      { kind: 'tree', x: 17.5, y: 21.2 },
      { kind: 'tree', x: 22.5, y: 21.2 },
      { kind: 'lamp', x: 25.4, y: 24.6 },
      { kind: 'stall', x: 25.6, y: 23.2 }
    ];

    return {
      key: 'stadt',
      name: 'Eichenstadt',
      rows: toStrings(g),
      music: 'stadt',
      spawn: { x: 26.5, y: 22 },
      zombies: false,

<script>
/* dialog.js – Textbox im Undertale-Stil: Buchstaben tippen sich einzeln,
   und man kann Antworten auswählen. */
(function (global) {
  'use strict';

  var box, whoEl, txtEl, optsEl, moreEl;

  var D = {
    queue: [],
    node: null,
    full: '',
    shown: 0,
    t: 0,
    speed: 42,          /* Buchstaben pro Sekunde */
    sel: 0,
    open: false,
    onFinish: null
  };

  function el(id) { return document.getElementById(id); }

  D.init = function () {
    box = el('box'); whoEl = el('who'); txtEl = el('txt');
    optsEl = el('opts'); moreEl = el('more');
    box.addEventListener('click', function (e) {
      if (e.target && e.target.classList.contains('opt')) return;
      D.press();
    });
  };

  /* text: String. who: Name. color: Farbe des Namens. opts: [{t:'Antwort', r:'Reaktion'}] */
  D.push = function (who, color, text, opts) {
    D.queue.push({ who: who, color: color || '#ffd24a', text: text, opts: opts || null });
  };
  D.say = function (who, color, text) { D.push(who, color, text); D.begin(); };

  D.begin = function (onFinish) {
    if (onFinish) D.onFinish = onFinish;
    if (!D.node) next();
  };

  function next() {
    if (!D.queue.length) {
      D.open = false;
      box.classList.remove('on');
      D.node = null;
      var f = D.onFinish; D.onFinish = null;
      if (f) f();
      return;
    }
    D.node = D.queue.shift();
    D.full = D.node.text;
    D.shown = 0; D.t = 0; D.sel = 0;
    D.open = true;
    box.classList.add('on');
    whoEl.textContent = D.node.who || '';
    whoEl.style.color = D.node.color || '#ffd24a';
    txtEl.textContent = '';
    optsEl.innerHTML = '';
    moreEl.classList.remove('on');
  }

  function showOptions() {
    optsEl.innerHTML = '';
    if (!D.node.opts) { moreEl.classList.add('on'); return; }
    for (var i = 0; i < D.node.opts.length; i++) {
      (function (i) {
        var d = document.createElement('div');
        d.className = 'opt' + (i === D.sel ? ' sel' : '');
        d.textContent = D.node.opts[i].t;
        d.addEventListener('click', function (ev) {
          ev.stopPropagation();
          D.sel = i; choose();
        });
        optsEl.appendChild(d);
      })(i);
    }
  }

  function markSel() {
    var kids = optsEl.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].className = 'opt' + (i === D.sel ? ' sel' : '');
    }
  }

  function choose() {
    var o = D.node.opts[D.sel];
    if (global.Audio8) Audio8.select();
    var node = D.node;
    D.node = null;
    optsEl.innerHTML = '';
    if (o.r) {
      D.queue.unshift({ who: node.who, color: node.color, text: o.r, opts: null });
    }
    if (o.go) o.go();
    next();
  }

  D.update = function (dt) {
    if (!D.node) return;
    if (D.shown < D.full.length) {
      D.t += dt * D.speed;
      while (D.t >= 1 && D.shown < D.full.length) {
        D.t -= 1; D.shown++;
        var c = D.full[D.shown - 1];
        if (c !== ' ' && global.Audio8 && D.shown % 2 === 0) Audio8.blip();
      }
      txtEl.textContent = D.full.slice(0, D.shown);
      if (D.shown >= D.full.length) showOptions();
    }
  };

  /* Bestätigen / weiter */
  D.press = function () {
    if (!D.node) return;
    if (D.shown < D.full.length) {          /* erst Text komplett zeigen */
      D.shown = D.full.length;
      txtEl.textContent = D.full;
      showOptions();
      return;
    }
    if (D.node.opts) { choose(); return; }
    D.node = null;
    next();
  };

  D.move = function (dir) {
    if (!D.node || !D.node.opts || D.shown < D.full.length) return;
    D.sel = (D.sel + dir + D.node.opts.length) % D.node.opts.length;
    if (global.Audio8) Audio8.blip();
    markSel();
  };

  D.isOpen = function () { return D.open; };
  D.clear = function () { D.queue.length = 0; D.node = null; D.open = false; if (box) box.classList.remove('on'); };

  global.Dialog = D;
})(window);

</script>
